// Track full row data by id so the player can pull rich metadata
// (parent name, date, type) without re-parsing the DOM.
const rowsById = {};
let currentOrder = []; // playable track ids, top to bottom as shown — powers next/prev

// The play queue is simply every playable row on screen, in order. Rebuilt
// after anything changes what's on screen (new results, "show all tracks").
function rebuildOrder() {
  currentOrder = [...document.querySelectorAll('.track[data-playable]')].map(el => el.dataset.rid);
}

// A human-confirmed title (from audio_text_links) beats Ashreinu's generic
// label like "Sicha 1" — which then gets demoted to the subtitle.
function trackTitle(row) { return row.confirmed_title || row.name || '(untitled)'; }
function hebDate(row) { return row.hebrew_day ? row.hebrew_day + ' ' + row.hebrew_month_name + ' ' + row.hebrew_year : ''; }

const ICON_BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>';
const ICON_EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

// One track row. `loose` = shown on its own (not under its farbrengen), so
// the subtitle has to carry the farbrengen name and date itself.
function trackRowHtml(row, loose, withSummary) {
  const rid = String(row.id);
  rowsById[rid] = row;
  const playable = !!getAudioUrl(row);
  const farbrengenId = row.parent_id || row.id;
  const label = row.confirmed_title ? row.name : typeLabel(row.type);
  const sub = withSummary
    ? [row.main_topic ? topicName(row.main_topic) : label, row.parent_id && row.parent_name ? row.parent_name : hebDate(row), dur(row.duration_ms)]
    : loose
      ? [label, row.parent_name, hebDate(row), dur(row.duration_ms)]
      : [label, dur(row.duration_ms)];
  const isNigun = typeKey(row.type) === 'niggun';
  return '<div class="track' + (playable ? '' : ' no-audio') + (rid === currentTrackId ? ' playing' : '') + (isSaved(rid) ? ' saved' : '') + '" id="card-' + rid + '" data-rid="' + rid + '"'
      + (playable ? ' data-playable onclick="playFromOrder(\'' + rid + '\')"' : '') + '>'
      + coverHtml('track-cover', row, false, '<span class="eq"><i></i><i></i><i></i></span>')
      + '<div class="track-info">'
        + '<div class="track-title">' + ROW_HEART + esc(trackTitle(row)) + '</div>'
        + '<div class="track-sub">' + sub.filter(Boolean).map(part => part === row.parent_name && row.parent_id
            ? farbrengenLinkHtml(row) : esc(part)).join(' · ') + '</div>'
        + (withSummary && row.summary_en ? '<div class="track-summary">' + esc(row.summary_en) + '</div>' : '')
      + '</div>'
      + (isNigun ? '' : '<button class="icon-btn sm" id="readbtn-' + rid + '" onclick="event.stopPropagation();openReader(\'' + rid + '\',' + farbrengenId + ')" aria-label="Read source text" title="Read source text">' + ICON_BOOK + '</button>')
    + '</div>';
}

// A farbrengen rendered like an album: cover, title, date, actions, then
// its tracks. `head` is the farbrengen's own row when the search returned it.
function albumHtml(fid, head, tracks) {
  if (head) rowsById[String(fid)] = head;
  const any = head || tracks[0];
  const title = head ? trackTitle(head) : (any.parent_name || 'Farbrengen');
  const farbIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + TYPE_ICONS.farb + '</svg>';
  const sub = [hebDate(any), any.secular_year ? dstr(any).split(' · ').pop() : ''].filter(Boolean).join(' · ');
  return '<section class="album" id="album-' + fid + '">'
    + '<div class="album-head">'
      + (head ? coverHtml('album-cover', head, false) : '<div class="album-cover cover cover-farb">' + farbIcon + '</div>')
      + '<div class="album-info">'
        + '<div class="album-kicker">Farbrengen</div>'
        + '<div class="album-title">' + esc(title) + '</div>'
        + '<div class="album-sub">' + esc(sub) + '</div>'
      + '</div>'
    + '</div>'
    + '<div class="album-actions">'
      + '<button class="icon-btn sm" id="readbtn-' + fid + '" onclick="openReader(\'' + fid + '\',' + fid + ')" aria-label="Read the farbrengen\'s text" title="Read the text">' + ICON_BOOK + '</button>'
      + '<a class="icon-btn sm" href="https://ashreinu.app/player?parentEvent=' + fid + '" target="_blank" rel="noopener" aria-label="Open in Ashreinu" title="Open in Ashreinu">' + ICON_EXT + '</a>'
      + '<span class="spacer"></span>'
      + '<button class="play-all" onclick="playAlbum(' + fid + ')" aria-label="Play this farbrengen">' + ICON_PLAY + '</button>'
    + '</div>'
    + '<div id="album-tracks-' + fid + '">' + tracks.map(r => trackRowHtml(r, false)).join('') + '</div>'
    + '<button class="show-tracks" id="album-more-' + fid + '" onclick="loadAlbumTracks(' + fid + ')">'
      + (tracks.length ? 'Show the whole farbrengen' : 'Show tracks') + '</button>'
  + '</section>';
}

function renderCards(items, before) {
  const el = document.getElementById('res');
  if (!items.length && !before) { el.innerHTML = '<div class="empty">No matches found in the archive.</div>'; currentOrder = []; return; }
  if (!items.length) { el.innerHTML = before; rebuildOrder(); return; }

  // Group consecutive items that belong to the same farbrengen (results
  // already come back in chronological order, so same-farbrengen items
  // are naturally adjacent).
  const groups = [];
  let lastKey = null;
  for (const row of items) {
    const isFarbrengen = row.type === 'Farbrengen';
    const key = row.parent_id || row.id;
    if (key === lastKey && groups.length) {
      groups[groups.length - 1].items.push(row);
      if (isFarbrengen) groups[groups.length - 1].farbrengenRow = row;
    } else {
      groups.push({ key, items: [row], farbrengenRow: isFarbrengen ? row : null });
      lastKey = key;
    }
  }

  el.innerHTML = (before ? before + '<h3 class="res-heading">Farbrengens &amp; tracks</h3>' : '') + groups.map(g => {
    // A lone track with no farbrengen context renders as a single row;
    // grouping only adds value with 2+ items or the farbrengen's own info.
    if (g.items.length === 1 && !g.farbrengenRow) return '<div class="loose">' + trackRowHtml(g.items[0], true) + '</div>';
    const tracks = g.farbrengenRow ? g.items.filter(r => r.id !== g.farbrengenRow.id) : g.items;
    return albumHtml(g.key, g.farbrengenRow, tracks);
  }).join('');
  rebuildOrder();
}

// Replace an album's matched tracks with ALL of the farbrengen's tracks, in
// recording order. Optionally start playing the first one.
async function loadAlbumTracks(fid, thenPlay) {
  const box = document.getElementById('album-tracks-' + fid);
  const more = document.getElementById('album-more-' + fid);
  if (more) { more.disabled = true; more.textContent = 'Loading…'; }
  try {
    const r = await fetch('/api/search?parentId=' + fid);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    const tracks = (j.results || []).filter(t => t.audio_uri);
    box.innerHTML = tracks.length ? tracks.map(t => trackRowHtml(t, false)).join('') : '<div class="read-empty">No audio tracks found for this farbrengen.</div>';
    if (more) more.remove();
    rebuildOrder();
    if (thenPlay && tracks.length) playFromOrder(String(tracks[0].id));
  } catch (e) {
    if (more) { more.disabled = false; more.textContent = 'Could not load tracks — tap to retry'; }
  }
}
function playAlbum(fid) {
  const first = document.querySelector('#album-tracks-' + fid + ' .track[data-playable]');
  if (first) playFromOrder(first.dataset.rid);
  else loadAlbumTracks(fid, true);
}

// ── Player: persistent mini bar + slide-up full "Now Playing" view ──
const audioEl = document.getElementById('audioEl');
let currentTrackId = null;

// One "cover" per content type stands in for album art, so every track
// has a recognizable visual even though the archive has no artwork.
const TYPE_ICONS = {
  sicha: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  maamar: '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>',
  niggun: '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',
  farb: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  other: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/>'
};
function typeKey(t) { return typeDot(t).replace('dot-', ''); }
function svgIcon(paths) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>'; }
function topicGroupSlug(slug) { const t = TOPIC_BY_SLUG[slug]; return t ? (t.parent_slug || t.slug) : null; }
// Decade of the recording (5710s, 5720s...), for date covers.
function eraIndex(year) { return Math.max(0, Math.min(4, Math.floor(((year || 5710) - 5710) / 10))); }
// What a cover shows, in order of how much it tells you about what's inside.
function coverSpec(row) {
  const group = row.confirmed_title && row.main_topic ? topicGroupSlug(row.main_topic) : null;
  if (group) return { kind: 'talk', cls: 'cover-talk tg-' + groupIndex(row.main_topic) };
  if (row.photo) return { kind: 'photo', cls: 'cover-photo' };
  if (!row.parent_id && row.hebrew_day) return { kind: 'date', cls: 'cover-date era-' + eraIndex(row.hebrew_year) };
  // Not catalogued yet: its type's color (sicha, ma'amar, niggun...), a little softer.
  return { kind: 'type', cls: 'cover-' + typeKey(row.type) + ' cover-soft' };
}
function coverInner(row, withLabel, big) {
  const spec = coverSpec(row);
  const typeIcon = svgIcon(TYPE_ICONS[typeKey(row.type)]);
  const label = '<div class="np-cover-label"><span>' + esc(typeLabel(row.type) || '') + '</span><strong>' + esc(row.hebrew_year || '') + '</strong></div>';
  // Color says the topic, text says the idea, the label says the format.
  if (spec.kind === 'talk') return withLabel ? '<div class="cv-title">' + esc(trackTitle(row)) + '</div>' + label : typeIcon;
  if (spec.kind === 'photo') return withLabel ? label : '';
  const datePage = '<div class="cv-date"><b>' + esc(row.hebrew_day) + '</b><span>' + esc(row.hebrew_month_name || '') + '</span></div>';
  // Small date covers show the year, except on a year page, where the day
  // (like a calendar page) is what tells events apart.
  if (spec.kind === 'date') return withLabel ? datePage + label : big ? datePage
    : row._dayCover ? '<span class="cv-day"><b>' + esc(row.hebrew_day) + '</b>' + esc((row.hebrew_month_name || '').slice(0, 4)) + '</span>'
    : '<span class="cv-year">' + esc(row.hebrew_year || '') + '</span>';
  return typeIcon + (withLabel ? label : '');
}
// The cover element itself: `base` is its size class (shelf-cover, track-cover...).
function coverHtml(base, row, withLabel, extra) {
  const spec = coverSpec(row);
  const img = spec.kind === 'photo' ? ' style="background-image:url(\'' + esc(base === 'np-cover' || base === 'ph-cover' ? row.photo_lg || row.photo : row.photo) + '\')"' : '';
  return '<div class="' + base + ' cover ' + spec.cls + '"' + img + '>' + coverInner(row, withLabel, base === 'album-cover') + (extra || '') + '</div>';
}
function setCover(el, row, withLabel) {
  const spec = coverSpec(row);
  const base = el.classList.contains('np-cover') ? 'np-cover' : el.classList.contains('mini-cover') ? 'mini-cover' : '';
  el.className = base + ' cover ' + spec.cls;
  el.style.backgroundImage = spec.kind === 'photo' ? "url('" + (base === 'np-cover' ? row.photo_lg || row.photo : row.photo) + "')" : '';
  el.innerHTML = coverInner(row, withLabel);
}
// Secondary line under a title: the original label when a confirmed title
// replaced it (e.g. "Sicha 1"), otherwise the type — plus the Hebrew date.
function trackSubtitle(row) {
  const label = row.confirmed_title ? row.name : typeLabel(row.type);
  const date = row.hebrew_day ? row.hebrew_day + ' ' + row.hebrew_month_name + ' ' + row.hebrew_year : '';
  return [label, date].filter(Boolean).join(' · ');
}

function playTrack(id, url, title) {
  document.querySelectorAll('.track.playing').forEach(c => c.classList.remove('playing'));
  const card = document.getElementById('card-'+id);
  if (card) card.classList.add('playing');

  // Remember where we were in the track we're leaving (unless it finished).
  if (currentTrackId && !audioEl.ended) savePosition(currentTrackId, audioEl.currentTime);

  const row = rowsById[id];
  currentTrackId = id;
  audioEl.src = url;
  audioEl.playbackRate = playbackSpeed;
  // Resume where you left off, unless you'd barely started or nearly finished.
  const resumeAt = savedPosition(id);
  const total = row && row.duration_ms ? row.duration_ms / 1000 : 0;
  if (resumeAt > 10 && (!total || resumeAt < total - 15)) {
    audioEl.addEventListener('loadedmetadata', () => { audioEl.currentTime = resumeAt; }, { once: true });
  }
  audioEl.play().catch(e => console.log('play error', e));
  if (row) rememberPlay(row);

  document.getElementById('playerTitle').textContent = title;
  document.getElementById('playerSub').textContent = row ? trackSubtitle(row) : '';
  if (row) setCover(document.getElementById('miniCover'), row, false);
  syncSaved(id, undefined, false);
  document.getElementById('playerBar').classList.add('open');
  document.getElementById('playerFill').style.width = '0%';
  document.getElementById('npFill').style.width = '0%';
  document.getElementById('npCur').textContent = '0:00';
  renderDuration();
  updateMediaSession(row, title);
  syncReaderBar();

  // Like Spotify: tapping play keeps you where you are (mini bar only).
  // If the full view is already open (e.g. next/prev), refresh it in place.
  if (npIsOpen()) { populateNowPlaying(id); updateSkipButtons(); }
}

function togglePlayPause() {
  if (!audioEl.src) return;
  if (audioEl.paused) audioEl.play(); else audioEl.pause();
}
function setPlayIcon(playing) {
  const d = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  document.getElementById('playerIcon').innerHTML = d;
  document.getElementById('npPlayIcon').innerHTML = d;
  document.getElementById('readerPlayIcon').innerHTML = d;
}
// Icons follow the audio element's real state, so lock-screen/headphone
// controls keep the on-screen buttons in sync too.
audioEl.addEventListener('play', () => { setPlayIcon(true); document.body.classList.remove('audio-paused'); });
audioEl.addEventListener('pause', () => { setPlayIcon(false); document.body.classList.add('audio-paused'); });
audioEl.addEventListener('ended', () => { setPlayIcon(false); savePosition(currentTrackId, 0); playNext(); });

function closePlayer() {
  audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load();
  document.getElementById('playerBar').classList.remove('open');
  document.querySelectorAll('.track.playing').forEach(c => c.classList.remove('playing'));
  currentTrackId = null;
  closeNowPlaying();
  syncReaderBar();
}
// Some browsers (notably Safari) can't work out the length of a streamed
// .opus file and report it as Infinity. The archive already knows every
// track's exact length (duration_ms), so fall back to that.
function trackDuration() {
  if (isFinite(audioEl.duration) && audioEl.duration > 0) return audioEl.duration;
  const row = rowsById[currentTrackId];
  return row && row.duration_ms ? row.duration_ms / 1000 : 0;
}
function skipBy(seconds) {
  const total = trackDuration();
  if (!total) return;
  audioEl.currentTime = Math.max(0, Math.min(total, audioEl.currentTime + seconds));
}

// ── Playback speed (remembered on this device) ──
const SPEEDS = [1, 1.25, 1.5, 1.75, 2, 0.75];
let playbackSpeed = 1;
try { playbackSpeed = parseFloat(localStorage.getItem('ashreinu-speed')) || 1; } catch (e) {}
function renderSpeed() {
  const btn = document.getElementById('speedBtn');
  btn.textContent = playbackSpeed + '×';
  btn.classList.toggle('on', playbackSpeed !== 1);
}
function cycleSpeed() {
  playbackSpeed = SPEEDS[(SPEEDS.indexOf(playbackSpeed) + 1) % SPEEDS.length];
  audioEl.playbackRate = playbackSpeed;
  try { localStorage.setItem('ashreinu-speed', playbackSpeed); } catch (e) {}
  renderSpeed();
}
renderSpeed();

// ── Progress + draggable seek bar ──
function fmtTime(s) {
  if (!isFinite(s)) return '0:00';
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(s % 60).padStart(2, '0');
  return h ? h + ':' + String(m).padStart(2, '0') + ':' + sec : m + ':' + sec;
}
let isSeeking = false;
function renderProgress(time) {
  const total = trackDuration();
  if (!total) return;
  const pct = Math.min(100, time / total * 100) + '%';
  document.getElementById('playerFill').style.width = pct;
  document.getElementById('npFill').style.width = pct;
  document.getElementById('npCur').textContent = fmtTime(time);
  document.getElementById('readerBarTime').textContent = fmtTime(time) + ' / ' + fmtTime(total);
}
let lastPositionSave = 0;
audioEl.addEventListener('timeupdate', () => {
  if (!isSeeking) renderProgress(audioEl.currentTime);
  // Save your place every few seconds, for "Continue listening".
  if (currentTrackId && Date.now() - lastPositionSave > 5000) {
    lastPositionSave = Date.now();
    savePosition(currentTrackId, audioEl.currentTime);
  }
});
audioEl.addEventListener('pause', () => { if (currentTrackId && !audioEl.ended) savePosition(currentTrackId, audioEl.currentTime); });

let afterPop = null; // a page change waiting for a layer's history.back() to finish

// Swipe down anywhere on a sheet (while scrolled to the top) to close —
// the sheet follows your finger, and closes if you pull far enough.
// Used by both the player and the Browse sheet.
function enableDragToClose(sheetId, scrollerId, closeFn) {
  const sheet = document.getElementById(sheetId);
  const scroller = document.getElementById(scrollerId);
  let startY = null, startX = 0, dy = 0, dragging = false;
  sheet.addEventListener('touchstart', e => {
    startY = (scroller.scrollTop > 0 || e.target.closest('.seek, .fn-sheet')) ? null : e.touches[0].clientY;
    startX = e.touches[0].clientX;
    dy = 0; dragging = false;
  }, { passive: true });
  sheet.addEventListener('touchmove', e => {
    if (startY === null) return;
    dy = e.touches[0].clientY - startY;
    // A sideways swipe (changing tracks on the cover) isn't a pull-down.
    if (!dragging && Math.abs(e.touches[0].clientX - startX) > Math.abs(dy)) { startY = null; return; }
    if (!dragging && dy > 8) { dragging = true; sheet.classList.add('dragging'); }
    if (dragging) {
      sheet.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });
  sheet.addEventListener('touchend', () => {
    if (startY === null) return;
    sheet.classList.remove('dragging');
    sheet.style.transform = '';
    if (dragging && dy > 100) closeFn();
    startY = null; dragging = false;
  });
}

// Swipe the player's cover (or the mini player) sideways to change track,
// like Spotify: left for the next, right for the previous. It follows your
// finger, slides out, and the new track slides in.
function enableTrackSwipe(el) {
  let x0 = null, y0 = 0, dx = 0, sideways = false;
  const reset = () => { el.style.transform = ''; el.style.opacity = ''; };
  el.addEventListener('touchstart', e => {
    if (e.target.closest('button')) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; sideways = false; el.style.transition = 'none';
  }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0;
    const dy = e.touches[0].clientY - y0;
    if (!sideways) {
      if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy) * 1.3) sideways = true;
      else if (Math.abs(dy) > 10) { x0 = null; return; }
    }
    if (sideways) {
      el.style.transform = 'translateX(' + dx * 0.7 + 'px)';
      el.style.opacity = String(1 - Math.min(0.5, Math.abs(dx) / 500));
      if (e.cancelable) e.preventDefault();
    }
  }, { passive: false });
  el.addEventListener('touchend', () => {
    if (x0 === null) return;
    x0 = null;
    el.style.transition = 'transform .2s ease, opacity .2s ease';
    if (!sideways) return;
    el.dataset.swiped = '1'; setTimeout(() => { delete el.dataset.swiped; }, 400); // not a tap
    const next = dx < 0;
    const btn = document.getElementById(next ? 'npNextBtn' : 'npPrevBtn');
    if (Math.abs(dx) < 70 || btn.disabled) { reset(); return; }
    el.style.transform = 'translateX(' + (next ? -110 : 110) + '%)'; el.style.opacity = '0';
    setTimeout(() => {
      if (next) playNext();
      else { const i = currentOrder.indexOf(currentTrackId); if (i > 0) playFromOrder(currentOrder[i - 1], true); } // a swipe always goes back a track
      el.style.transition = 'none';
      el.style.transform = 'translateX(' + (next ? 40 : -40) + 'px)';
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.transition = 'transform .22s ease, opacity .22s ease'; reset(); }));
    }, 170);
  });
}

// ── Source text: parsing raw OCR into a clean, structured reading view ──
// Entirely pattern-matching (no AI call), so it's instant and applies
// retroactively to everything already saved. Turns page-by-page OCR text into:
//   blocks:    paragraphs (with section letters like א / ב), dividers (* * *),
//              and asides ([... ניגון ...] stage notes)
//   footnotes: every footnote definition, in the order it appears
// Footnote numbers can restart (e.g. per page), so a marker is matched to
// the n-th definition with that number — never just "the" definition.
const SUPER_MAP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
function superToPlain(s) { return s.split('').map(c => SUPER_MAP[c] !== undefined ? SUPER_MAP[c] : c).join(''); }

function parseSourceText(rawText, savedFootnotes) {
  if (!rawText) return { blocks: [], footnotes: [] };

  let paragraphs = rawText
    .split(/---\s*page break\s*---/gi).join('\n\n')
    .split(/\n\s*\n+/)
    .map(p => p.replace(/\s*\n\s*/g, ' ').trim())
    .filter(Boolean);

  // Drop running headers ("טו תמוז ה'תשט"ו 45") and bare page numbers.
  const HEADER_WORDS = /תשרי|חשון|כסלו|טבת|שבט|אדר|ניסן|אייר|סיון|תמוז|אב|אלול|ה['׳]תש|ה["״]תש/;
  paragraphs = paragraphs.filter(p => {
    if (/^\d{1,4}$/.test(p)) return false;
    if (p.length < 70 && HEADER_WORDS.test(p) && (/^\d/.test(p) || /\d{1,4}$/.test(p))) return false;
    return true;
  });

  const footnotes = [];   // [{ n: '12', text }] in document order
  const blocks = [];
  for (const p of paragraphs) {
    // A footnote-definition block: "1) ... 2) ..." (or a single "12) ...")
    const defs = [...p.matchAll(/(?:^|\s)(\d{1,3})\)\s*/g)];
    if (defs.length >= 2 || (defs.length === 1 && /^\s*\d{1,3}\)/.test(p))) {
      defs.forEach((m, i) => {
        const start = m.index + m[0].length;
        const end = i + 1 < defs.length ? defs[i + 1].index : p.length;
        const text = p.slice(start, end).trim();
        if (text) footnotes.push({ n: m[1], text });
      });
      continue;
    }
    if (/^[\s*•·—–\-]+$/.test(p) && /[*•]/.test(p)) { blocks.push({ kind: 'divider' }); continue; }
    const clean = p.replace(/\*\*/g, '').trim();
    if (/^[\[(][^\])]{2,200}[\])]$/.test(clean)) { blocks.push({ kind: 'aside', text: clean }); continue; }
    // Section letter at the start: "א." / "יח." / "ב׳"
    const point = clean.match(/^([א-ת]{1,3})[.׳']\s+/);
    blocks.push({ kind: 'p', point: point ? point[1] : null, text: point ? clean.slice(point[0].length) : clean });
  }

  // Footnotes saved by the older backend extraction fill any gaps.
  (savedFootnotes || []).forEach(f => { if (!footnotes.some(x => x.n === String(f.marker))) footnotes.push({ n: String(f.marker), text: f.text }); });

  // Mark in-body footnote markers (three OCR styles) with a {{fn:N}} token.
  for (const b of blocks) {
    if (b.kind !== 'p') continue;
    b.text = b.text
      .replace(/[⁰¹²³⁴-⁹]+/g, m => `{{fn:${superToPlain(m)}}}`)
      .replace(/<sup>(\w+)<\/sup>/g, '{{fn:$1}}')
      .replace(/([֐-׿"'׳״])(\d{1,3})(?=[\s,.:;)\]׳״"'׳״?!]|$)/g, (m, ch, num) => `${ch}{{fn:${num}}}`);
  }
  return { blocks, footnotes };
}

// Render a parsed text. Returns { html, notesHtml }. `prefix` keeps
// footnote ids unique when several sichos are shown together.
function renderSourceText(rawText, savedFootnotes, prefix) {
  const { blocks, footnotes } = parseSourceText(rawText, savedFootnotes);
  const seen = {}; // how many times each number has appeared so far
  const used = new Set();
  const html = blocks.map(b => {
    if (b.kind === 'divider') return '<div class="rd-divider" aria-hidden="true">✦ ✦ ✦</div>';
    if (b.kind === 'aside') return '<p class="rd-aside">' + esc(b.text) + '</p>';
    const body = esc(b.text).replace(/\{\{fn:(\w+)\}\}/g, (m, n) => {
      seen[n] = (seen[n] || 0) + 1;
      // the seen[n]-th definition with this number, else the first one
      const matches = footnotes.map((f, i) => f.n === n ? i : -1).filter(i => i >= 0);
      const idx = matches[seen[n] - 1] ?? matches[0];
      if (idx !== undefined) used.add(idx);
      const id = prefix + '-' + (idx ?? 'x' + n);
      FOOTNOTES[id] = { n, text: idx !== undefined ? footnotes[idx].text : null };
      return '<sup class="fn" role="button" tabindex="0" data-fn="' + id + '">' + esc(n) + '</sup>';
    });
    return '<p>' + (b.point ? '<span class="rd-point">' + esc(b.point) + '</span>' : '') + body + '</p>';
  }).join('');
  const notesHtml = footnotes.length
    ? '<section class="rd-notes"><h4>Footnotes</h4><ol>' + footnotes.map(f =>
        '<li><b>' + esc(f.n) + '</b><span>' + esc(f.text) + '</span></li>').join('') + '</ol></section>'
    : '';
  return { html, notesHtml, firstText: (blocks.find(b => b.kind === 'p')?.text || '').replace(/\{\{fn:\w+\}\}/g, '') };
}
const FOOTNOTES = {};

// ── Fetching (cached per farbrengen + track) ──
const textCache = {};
async function fetchSourceText(farbrengenId, eventId) {
  const key = farbrengenId + ':' + (eventId || '');
  if (!textCache[key]) {
    textCache[key] = fetch('/api/get-farbrengen-text?farbrengenId=' + farbrengenId + (eventId ? '&eventId=' + eventId : ''))
      .then(r => r.json())
      .then(j => { if (j.error) throw new Error(j.error); return j; })
      .catch(e => { delete textCache[key]; throw e; });
  }
  return textCache[key];
}

// ── Preview card inside the full player ──
async function loadTextPreview(rid) {
  const row = rowsById[rid];
  const el = document.getElementById('npReadContent');
  if (!row) return;
  const fid = row.parent_id || row.id;
  if (typeKey(row.type) === 'niggun') {
    el.innerHTML = '<p class="pv-note">Niggunim have no written text.</p>';
    return;
  }
  el.innerHTML = '<div class="skel-line title"></div><div class="skel-line"></div><div class="skel-line meta"></div>';
  try {
    const j = await fetchSourceText(fid, rid);
    if (currentTrackId !== rid) return; // track changed while loading
    if (j.unconfirmed) {
      el.innerHTML = '<p class="pv-note">' + (j.candidateCount
          ? 'This track hasn\'t been matched to its written text yet. The farbrengen has ' + j.candidateCount + ' transcribed ' + (j.candidateCount !== 1 ? 'sichos' : 'sicha') + '.'
          : 'No transcribed text for this farbrengen yet.') + '</p>'
        + (j.candidateCount ? '<button class="pv-btn ghost" onclick="openReader(\'' + fid + '\',' + fid + ')">Read the whole farbrengen\'s text</button>' : '');
      return;
    }
    if (!j.hasText || !j.segments?.length) { el.innerHTML = '<p class="pv-note">No transcribed text for this farbrengen yet.</p>'; return; }
    const s = j.segments[0];
    const { firstText } = renderSourceText(s.source_text || s.outline_he, s.footnotes, 'pv');
    el.innerHTML =
      sourceBadge(j, false)
      + (s.summary_en ? '<p class="pv-summary">' + esc(s.summary_en) + '</p>' : '')
      + tagChipsHtml(s.tags, s.topic_slugs)
      + (firstText ? '<div class="pv-excerpt" dir="rtl" lang="he">' + esc(firstText) + '</div>' : '')
      + '<button class="pv-btn" onclick="openReader(\'' + rid + '\',' + fid + ')">' + (s.source_text ? 'Read full text' : 'Read the outline') + '</button>';
  } catch (e) {
    el.innerHTML = '<p class="pv-note">Could not load the text. <button class="see-all" onclick="loadTextPreview(\'' + rid + '\')">Retry</button></p>';
  }
}
// Where an entry came from: a human confirmed it, or Claude wrote it from

    ? esc(row ? trackTitle(row) : 'Farbrengen')
    : row?.parent_id && row.parent_name ? farbrengenLinkHtml(row, true) : esc(row?.parent_name || (row ? trackTitle(row) : ''));
  document.getElementById('readerKicker').textContent = whole ? 'Farbrengen text' : 'Source text';
  document.getElementById('readerScroll').scrollTop = 0;
  const body = document.getElementById('readerBody');
  body.innerHTML = '<div class="rd-head"><div class="skel-line meta"></div><div class="skel-line title" style="height:26px;margin:12px 0"></div><div class="skel-line"></div><div class="skel-line"></div></div>';
  reader.classList.add('open');
  document.getElementById('readerBackdrop').classList.add('open');
  syncReaderBar();

  try {
    const j = await fetchSourceText(farbrengenId, whole ? farbrengenId : eventId);
    if (j.unconfirmed) {
      body.innerHTML = '<div class="rd-head"><h2 class="rd-title">' + esc(row ? trackTitle(row) : '') + '</h2>'
        + '<p class="rd-summary">This track hasn\'t been matched to its written text yet.</p>'
        + (j.candidateCount ? '<button class="pv-btn" onclick="openReader(\'' + farbrengenId + '\',' + farbrengenId + ')">Read the whole farbrengen\'s text</button>' : '') + '</div>';
      return;
    }
    if (!j.hasText || !j.segments?.length) {
      body.innerHTML = '<div class="rd-head"><p class="rd-summary">No transcribed text for this farbrengen yet.</p></div>';
      return;
    }
    const segs = j.segments;
    const many = segs.length > 1;
    const kicker = row && !whole ? trackSubtitle(row) : (row ? hebDate(row) : '');
    body.innerHTML =
      (many ? '<nav class="rd-toc"><div class="rd-kicker">' + esc(kicker) + '</div><h2 class="rd-title">' + segs.length + ' sichos</h2><ol>'
          + segs.map((s, i) => '<li><a href="#rd-seg-' + i + '" onclick="event.preventDefault();document.getElementById(\'rd-seg-' + i + '\').scrollIntoView({behavior:\'smooth\'})"><b>' + (i + 1) + '</b>' + esc(s.title_en || 'Sicha ' + (i + 1)) + '</a></li>').join('')
          + '</ol></nav>' : '')
      + segs.map((s, i) => {
        const { html, notesHtml } = renderSourceText(s.source_text, s.footnotes, 'rd' + i);
        return '<section class="rd-seg" id="rd-seg-' + i + '">'
          + '<header class="rd-head">'
            + (!many && kicker ? '<div class="rd-kicker">' + esc(kicker) + '</div>' : (many ? '<div class="rd-kicker">Sicha ' + (i + 1) + ' of ' + segs.length + '</div>' : ''))
            + '<h2 class="rd-title">' + esc(s.title_en || (row ? trackTitle(row) : 'Source text')) + '</h2>'
            + sourceBadge(j, true)
            + (s.summary_en ? '<p class="rd-summary">' + esc(s.summary_en) + '</p>' : '')
            + ((s.key_points || []).length ? '<ul class="rd-kp">' + s.key_points.map(k => '<li>' + esc(k) + '</li>').join('') + '</ul>' : '')
            + tagChipsHtml(s.tags, s.topic_slugs)
          + '</header>'
          + (s.outline_he ? '<div class="rd-sublabel">Outline</div><div class="rd-outline" lang="he">' + esc(s.outline_he) + '</div>' : '')
          + (s.source_text && s.outline_he ? '<div class="rd-sublabel">' + esc(s.transcript_kind || 'Hanacha') + '</div>' : '')
          + (s.source_text ? '<article class="rd-text" dir="rtl" lang="he">' + html + '</article>' : '')
          + notesHtml
        + '</section>';
      }).join('<div class="rd-seg-sep"></div>');
  } catch (e) {
    body.innerHTML = '<div class="rd-head"><p class="rd-summary">Could not load the text: ' + esc(e.message) + '</p>'
      + '<button class="pv-btn" onclick="openReader(\'' + eventId + '\',' + farbrengenId + ')">Try again</button></div>';
  }
}
function closeReader(fromBackButton) {
  if (!readerIsOpen()) return;
  closeFootnote();
  document.getElementById('reader').classList.remove('open');
  document.getElementById('readerBackdrop').classList.remove('open');
  if (!fromBackButton) popOwnHistory('reader');
}
// The small play bar at the bottom of the Reader, for reading along.
function syncReaderBar() {
  const bar = document.getElementById('readerBar');
  const row = currentTrackId ? rowsById[currentTrackId] : null;
  bar.classList.toggle('show', !!row);
  if (row) document.getElementById('readerBarTitle').textContent = trackTitle(row);
}

// ── Footnotes: tap a number, the note slides up from the bottom ──
function openFootnote(id, marker) {
  const f = FOOTNOTES[id];
  if (!f) return;
  document.querySelectorAll('.fn.active').forEach(el => el.classList.remove('active'));
  marker?.classList.add('active');
  document.getElementById('fnLabel').textContent = 'Footnote ' + f.n;
  const text = document.getElementById('fnText');
  text.textContent = f.text || 'This footnote\'s text wasn\'t captured in the transcription.';
  text.classList.toggle('missing', !f.text);
  document.getElementById('fnSheet').classList.add('open');
}
function closeFootnote() {
  document.getElementById('fnSheet').classList.remove('open');
  document.querySelectorAll('.fn.active').forEach(el => el.classList.remove('active'));
}
function footnoteIsOpen() { return document.getElementById('fnSheet').classList.contains('open'); }
document.getElementById('readerScroll').addEventListener('click', e => {
  const fn = e.target.closest('.fn');
  if (fn) { e.stopPropagation(); openFootnote(fn.dataset.fn, fn); return; }
  if (footnoteIsOpen()) closeFootnote();
});
document.getElementById('readerScroll').addEventListener('keydown', e => {
  const fn = e.target.closest?.('.fn');
  if (fn && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openFootnote(fn.dataset.fn, fn); }
});

document.getElementById('q').addEventListener('input', () => { syncSearchClear(); debouncedSearch(); });

// ── Header helpers ──
function syncSearchClear() {
  document.getElementById('searchBox').classList.toggle('has-text', !!document.getElementById('q').value);
}
function clearSearch() {
  document.getElementById('q').value = '';
  syncSearchClear();
  document.getElementById('q').focus();
  search();
}
function syncFilterChips() {
  document.getElementById('yearChip').classList.toggle('active', !!document.getElementById('yf').value);
}
// Year picker lists only years that actually exist in the archive.
async function loadYearOptions() {
  const years = await getYears();
  const sel = document.getElementById('yf');
  const current = sel.value;
  sel.innerHTML = '<option value="">Year</option>' + years.map(y => '<option>' + y + '</option>').join('');
  if (current) setYearFilter(current);
}
function setYearFilter(year) {
  const sel = document.getElementById('yf');
  if (![...sel.options].some(o => o.value === String(year))) sel.add(new Option(year, year));
  sel.value = String(year);
}
window.addEventListener('scroll', () => {
  document.getElementById('appHeader').classList.toggle('scrolled', window.scrollY > 4);
}, { passive: true });
document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter'){ clearTimeout(debounceTimer); search(); } });

// ── Init ──
(async function init() {
  initTheme();
  enableDragToClose('browseSheet', 'browseScroll', () => closeBrowseSheet());
  enableDragToClose('reader', 'readerScroll', () => closeReader());
  loadYearOptions();
  await Promise.all([loadTodayHebrewDate(), loadTopicList()]);
  // Links like index.html?q=teshuvah or index.html?track=5009&f=4999 (used by the pipeline review page).
  const params = new URLSearchParams(location.search);
  const occ = COLLECTIONS.findIndex(c => c.name === params.get('occasion'));
  const page = params.get('topic') ? { p: 'topic', slug: params.get('topic') }
    : params.get('niggun') ? { p: 'niggun', key: params.get('niggun') }
    : /^\d+$/.test(params.get('album') || '') ? { p: 'album', fid: +params.get('album') }
    : params.get('saved') ? { p: 'saved' }
    : params.get('history') ? { p: 'history' }
    : occ >= 0 ? { p: 'occasion', i: occ }
    : params.get('q') || params.get('type') ? { p: 'search', q: params.get('q') || '', type: params.get('type') || '', year: params.get('year') || '' }
    : /^\d{4}$/.test(params.get('year') || '') ? { p: 'year', y: +params.get('year') }
    : { p: 'home' };
  if (!params.get('track') && !params.get('play')) history.replaceState({ page, depth: 0 }, '', pageUrl(page));
  else history.replaceState({ page, depth: 0 }, '');
  await renderPage(page);
  if (params.get('track') && params.get('f')) openReader(params.get('track'), parseInt(params.get('f'), 10));
  if (/^\d+$/.test(params.get('play') || '')) showShared(params.get('play'));
})();
</script>
