<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashreinu Search</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#161310">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=David+Libre:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Dark theme — the default. Deep warm charcoal, not pure black, so we
     read as a distinct identity rather than mimicking Ashreinu's own
     pure-black shell. */
  --ink:#ede7da;--ink-mid:#b3aa98;--ink-light:#8a8270;--ink-faint:#5c5648;
  --gold:#d9a63f;--gold-dim:#e2b04e;--gold-bg:#3a2f1a;
  --burgundy:#c96b6b;
  --bg:#161310;--surface:#211d17;--border:#332e25;--border-soft:#2a251d;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.25),0 1px 1px rgba(0,0,0,0.2);
  --shadow-md:0 4px 16px rgba(0,0,0,0.35),0 1px 3px rgba(0,0,0,0.25);
  --shadow-lg:0 8px 30px rgba(0,0,0,0.45),0 2px 8px rgba(0,0,0,0.3);
  --radius:14px;--radius-sm:9px;
  --sicha:#5b8ce8;--maamar:#b478e8;--farb:#4fbf82;--niggun:#e0a24f;
  --elevated:#2b261f;--hover:rgba(255,255,255,0.08);--track:rgba(255,255,255,0.18);
  --tint-sicha:#1c2a4d;--tint-maamar:#2c1d45;--tint-farb:#16352a;--tint-niggun:#3d2a12;--tint-other:#2b261f;
}
:root[data-theme="light"]{
  /* Light theme — the original warm archival palette, opt-in via the toggle. */
  --ink:#1b1712;--ink-mid:#5c5648;--ink-light:#93897a;--ink-faint:#c9c1b3;
  --gold:#a3762f;--gold-dim:#7d5a24;--gold-bg:#faf1de;
  --burgundy:#8a3a3a;
  --bg:#f7f4ee;--surface:#fffdf9;--border:#e6ded0;--border-soft:#efe9dd;
  --shadow-sm:0 1px 2px rgba(27,23,18,0.04),0 1px 1px rgba(27,23,18,0.03);
  --shadow-md:0 4px 16px rgba(27,23,18,0.06),0 1px 3px rgba(27,23,18,0.04);
  --shadow-lg:0 8px 30px rgba(27,23,18,0.10),0 2px 8px rgba(27,23,18,0.05);
  --sicha:#2f5fb8;--maamar:#8a3ab8;--farb:#2e7d4f;--niggun:#b8721a;
  --elevated:#ffffff;--hover:rgba(27,23,18,0.06);--track:rgba(27,23,18,0.14);
  --tint-sicha:#dde6f7;--tint-maamar:#ebdff5;--tint-farb:#dcefe3;--tint-niggun:#f6e6cc;--tint-other:#efe9dd;
}
html{scroll-behavior:smooth;transition:background-color .2s}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:96px;-webkit-font-smoothing:antialiased;transition:background-color .2s,color .2s}

/* ═══ Bottom sheet (Browse) — slides up and swipes away like the player ═══ */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;top:6vh;max-width:760px;margin:0 auto;background:var(--bg);z-index:40;
  display:flex;flex-direction:column;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35);overflow:hidden;
  transform:translateY(100%);visibility:hidden;
  transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s;
}
.sheet.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet.dragging{transition:none}
.sheet-handle-row{flex-shrink:0;padding:10px 0 2px;display:flex;justify-content:center}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:var(--track)}
.sheet-topbar{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 6px 20px;flex-shrink:0}
.sheet-title{font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.sheet-scroll{flex:1;overflow-y:auto;padding:6px 20px calc(32px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.browse-tabs{display:flex;gap:8px;margin:0 -20px 18px;padding:0 20px 2px;overflow-x:auto;scrollbar-width:none}
.browse-tabs::-webkit-scrollbar{display:none}
.browse-pane{display:none}
.browse-pane.active{display:block}

/* ═══ Home — horizontal "shelves", like a music app's home screen ═══ */
.home-section{margin-bottom:32px}
#res > .home-section:first-child{margin-top:10px}
.home-section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.home-section-head h3{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.2}
.see-all{font:inherit;font-size:13px;font-weight:700;color:var(--ink-light);background:none;border:none;cursor:pointer;white-space:nowrap;padding:4px 0}
.see-all:hover{color:var(--ink)}
.home-sub{font-size:13px;color:var(--ink-light);margin:-8px 0 12px}
.shelf{display:flex;gap:14px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf-card{flex:0 0 140px;width:140px;cursor:pointer;scroll-snap-align:start;-webkit-tap-highlight-color:transparent}
.shelf-cover{width:140px;height:140px;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.22);transition:transform .15s}
.shelf-card:hover .shelf-cover{transform:translateY(-3px)}
.shelf-card:active .shelf-cover{transform:scale(.97)}
.shelf-cover svg{width:38%;height:38%}
.shelf-cover .np-cover-label{left:11px;right:11px;bottom:9px}
.shelf-cover .np-cover-label span{font-size:9.5px}
.shelf-cover .np-cover-label strong{font-size:17px}
.jump-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:720px){.jump-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.jump-card{position:relative;display:flex;align-items:center;gap:10px;height:56px;background:var(--elevated);border-radius:8px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.jump-card:hover{background:var(--hover)}
.jump-cover{width:56px;height:56px;flex-shrink:0}
.jump-title{font-size:13px;font-weight:700;color:var(--ink);line-height:1.25;padding-right:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jump-progress{position:absolute;left:56px;right:0;bottom:0;height:2px;background:var(--track)}
.jump-progress i{display:block;height:100%;background:var(--gold)}
.ep-card{flex:0 0 272px;width:272px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;scroll-snap-align:start;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.ep-card:hover{transform:translateY(-2px)}
.ep-head{display:flex;gap:10px;align-items:center}
.ep-cover{width:44px;height:44px;border-radius:8px}
.ep-meta{display:flex;flex-direction:column;min-width:0;font-size:12px;color:var(--ink-light);line-height:1.35}
.ep-meta b{font-weight:700;color:var(--ink-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-title{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.25;margin-top:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep-summary{font-size:13.5px;color:var(--ink-mid);line-height:1.45;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.topic-shelf .topic-tile{flex:0 0 160px;scroll-snap-align:start}
.shelf-title{font-size:14px;font-weight:600;color:var(--ink);line-height:1.3;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shelf-sub{font-size:12.5px;color:var(--ink-light);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf-progress{height:3px;border-radius:2px;background:var(--track);margin-top:8px;overflow:hidden}
.shelf-progress i{display:block;height:100%;background:var(--gold)}
.shelf-empty{font-size:13.5px;color:var(--ink-light);padding:4px 0}
.skel-shelf{flex:0 0 140px}
.skel-shelf .skel-cover{width:140px;height:140px;border-radius:10px;margin-bottom:10px}

/* Type tiles (home "Browse all" + Browse sheet) reuse the cover gradients */
.tile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:560px){.tile-grid{grid-template-columns:repeat(4,1fr)}}
.type-tile{
  position:relative;overflow:hidden;border-radius:12px;min-height:96px;padding:14px 15px;color:#fff;cursor:pointer;
  font-size:16.5px;font-weight:700;letter-spacing:-.01em;transition:transform .15s;-webkit-tap-highlight-color:transparent;
}
.type-tile:hover{transform:translateY(-2px)}
.type-tile:active{transform:scale(.97)}
.type-tile svg{position:absolute;right:-6px;bottom:-8px;width:64px;height:64px;transform:rotate(16deg);opacity:.4}

/* Occasion / month cards and year chips */
.card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.card-grid{grid-template-columns:repeat(3,1fr)}}
.occasion{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:14px;cursor:pointer;
  transition:background .15s;-webkit-tap-highlight-color:transparent;
}
.occasion:hover{background:var(--hover)}
.occasion strong{display:block;font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.3}
.occasion span{display:block;font-size:12.5px;color:var(--ink-light);margin-top:3px}
.chip-scroll{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chip-scroll::-webkit-scrollbar{display:none}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px}
.back-link{display:inline-flex;align-items:center;gap:2px;padding-left:10px}
.back-link svg{width:18px;height:18px}

@font-face {
  font-family: 'DachHeilig';
  src: url('/fonts/Heilig.OTF') format('opentype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

.read-empty{font-size:13px;color:var(--ink-light);font-style:italic;padding:8px 0}

.empty{color:var(--ink-light);font-size:14.5px;line-height:1.9;padding:60px 0;text-align:center;font-family:'Inter',sans-serif}

.filters-row-wrap{display:none}
.filters-row-wrap.active{display:flex}

/* ═══ App header — same surface as the page; a shadow appears once you scroll ═══ */
#appHeader{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;transition:box-shadow .2s}
#appHeader.scrolled{box-shadow:0 1px 0 var(--border-soft),0 8px 24px rgba(0,0,0,.18)}
.header-inner{max-width:720px;margin:0 auto}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.wordmark{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}
.wordmark-icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#f0c66b,#9a6a1e);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.wordmark-icon svg{width:36px;height:36px;color:#1f1508;flex-shrink:0}
.wordmark-text{min-width:0}
.wordmark-text h1{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1.15}
.wordmark-text span{font-size:12.5px;color:var(--ink-light);font-weight:500;display:block;white-space:nowrap}
.appbar-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.appbar-actions .icon-btn{width:40px;height:40px}
.browse-btn{
  display:flex;align-items:center;gap:7px;height:40px;padding:0 15px 0 12px;border-radius:20px;border:none;
  background:var(--hover);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;
}
.browse-btn:hover{background:var(--track)}
.browse-btn svg{width:18px;height:18px}

/* ═══ Search — a pill, icon on the left, clear button on the right ═══ */
.search-box{
  position:relative;display:flex;align-items:center;height:50px;background:var(--elevated);border-radius:25px;
  border:1.5px solid var(--border-soft);transition:border-color .15s,box-shadow .15s;
}
.search-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,166,63,.14)}
.search-icon{display:flex;padding:0 8px 0 17px;color:var(--ink-light);flex-shrink:0}
.search-icon svg{width:20px;height:20px}
.search-icon.loading svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.search-box input{flex:1;min-width:0;height:100%;border:none;background:none;outline:none;color:var(--ink);font:inherit;font-size:16px;padding:0 4px}
.search-box input::placeholder{color:var(--ink-light)}
.search-box input::-webkit-search-cancel-button{display:none}
.search-box .search-clear{display:none;margin-right:5px;width:38px;height:38px}
.search-box.has-text .search-clear{display:flex}

/* ═══ Filter chips — one swipeable row, never wraps ═══ */
.chips{gap:8px;margin:12px -16px 0;padding:0 16px 2px;overflow-x:auto;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;height:34px;padding:0 15px;border-radius:17px;border:none;background:var(--hover);color:var(--ink);
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;white-space:nowrap;
  transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;
}
.chip:hover{background:var(--track)}
.chip.active{background:var(--gold);color:#1a1408}
.chip-divider{width:1px;height:20px;background:var(--border);flex-shrink:0}
.chip-select{padding:0;position:relative}
.chip-select select{
  appearance:none;-webkit-appearance:none;background:none;border:none;color:inherit;font:inherit;
  height:100%;padding:0 32px 0 15px;cursor:pointer;outline:none;
}
.chip-select select option{background:var(--surface);color:var(--ink)}
.chip-select::after{
  content:'';position:absolute;right:14px;top:50%;width:6px;height:6px;pointer-events:none;opacity:.75;
  border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-70%) rotate(45deg);
}

/* ═══ Results — a farbrengen is an "album", its sichos/niggunim are tracks ═══ */
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 24px}
#rmeta{font-size:13px;color:var(--ink-light);margin:4px 0 14px;font-weight:500;min-height:18px}
#rmeta:empty{display:none}
.album{margin-bottom:30px}
.album-head{display:flex;align-items:center;gap:14px}
.album-cover{width:72px;height:72px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.album-info{flex:1;min-width:0}
.album-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light)}
.album-title{font-size:18px;font-weight:700;color:var(--ink);line-height:1.25;letter-spacing:-.015em;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.album-sub{font-size:13px;color:var(--ink-light);margin-top:3px}
.album-actions{display:flex;align-items:center;gap:2px;margin:10px 0 6px}
.album-actions .icon-btn{color:var(--ink-light)}
.album-actions .icon-btn:hover,.album-actions .icon-btn.on{color:var(--ink)}
.album-actions .spacer{flex:1}
.play-all{
  width:50px;height:50px;border-radius:50%;background:var(--gold);color:#1a1408;border:none;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:transform .12s;
}
.play-all:active{transform:scale(.92)}
.play-all svg{width:22px;height:22px}
.show-tracks{
  display:block;margin:6px 0 0;padding:10px 0;background:none;border:none;color:var(--ink-mid);
  font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
}
.show-tracks:hover{color:var(--ink)}

.track{
  display:flex;align-items:center;gap:12px;padding:7px 8px;margin:0 -8px;border-radius:10px;cursor:pointer;
  transition:background .15s;-webkit-tap-highlight-color:transparent;
}
.track:hover{background:var(--hover)}
.track.no-audio{cursor:default}
.track.no-audio:hover{background:none}
.track-cover{width:46px;height:46px;border-radius:7px}
.track-info{flex:1;min-width:0}
.track-title{font-size:15px;font-weight:600;color:var(--ink);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.track-sub{font-size:13px;color:var(--ink-light);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track.playing .track-title{color:var(--gold)}
.track .icon-btn{color:var(--ink-light)}
.track .icon-btn.on{color:var(--gold)}
.loose{margin-bottom:6px}

/* Animated equalizer replaces the cover icon on the track that's playing */
.eq{display:none;gap:3px;align-items:flex-end;height:18px}
.eq i{width:3px;height:6px;background:#fff;border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.45s}
.eq i:nth-child(3){animation-delay:-.75s}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
.track.playing .cover > :not(.eq){display:none}
.track.playing .eq{display:flex}
body.audio-paused .eq i{animation-play-state:paused}


/* ═══ Skeleton rows while loading ═══ */
.skel-row{display:flex;align-items:center;gap:12px;padding:7px 0}
.skel-cover{width:46px;height:46px;border-radius:7px;flex-shrink:0}
.skel-lines{flex:1}
.skel-cover,.skel-line{background:linear-gradient(90deg,var(--hover) 25%,var(--track) 50%,var(--hover) 75%);background-size:800px 100%;animation:shimmer 1.3s infinite}
.skel-line{height:12px;border-radius:4px}
.skel-line.title{width:62%;height:14px;margin-bottom:8px}
.skel-line.meta{width:34%}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}

/* ═══ Type "covers" — a colored tile per content type stands in for album art ═══ */
.cover{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.cover svg{width:46%;height:46%;opacity:.92}
.cover-sicha{background:linear-gradient(140deg,#5b86e0,#1f3470)}
.cover-maamar{background:linear-gradient(140deg,#a66ae0,#43226b)}
.cover-farb{background:linear-gradient(140deg,#46a872,#1a4c31)}
.cover-niggun{background:linear-gradient(140deg,#e0a04a,#7a4714)}
.cover-other{background:linear-gradient(140deg,#8f8775,#3a352c)}
/* Covers say what's INSIDE, not the format (see coverSpec): a catalogued
   talk shows its title on its topic's color; an event with a JEM photo shows
   the photo; other events get a date page colored by decade; anything else
   gets a quiet cover so the catalogued talks stand out. */
.cover-talk{background:var(--tg);align-items:stretch;justify-content:flex-start;flex-direction:column;text-align:left}
.cover-talk > svg{width:46%;height:46%;opacity:.95;margin:auto}
.cv-title{position:relative;font-weight:800;letter-spacing:-.02em;line-height:1.12;padding:12px 12px 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:16px}
.np-cover .cv-title{font-size:30px;padding:24px 24px 0;-webkit-line-clamp:5}
.cover-photo{background:#2a2622 center/cover no-repeat}
.cover-photo::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6),transparent 55%);pointer-events:none}
.cover-photo .np-cover-label{z-index:1}
.track-cover.cover-photo::after,.mini-cover.cover-photo::after,.jump-cover.cover-photo::after,.ep-cover.cover-photo::after,.album-cover.cover-photo::after{display:none}
.era-0{background:linear-gradient(140deg,#4d7a8c,#1d3540)}
.era-1{background:linear-gradient(140deg,#6b6fb5,#262a5c)}
.era-2{background:linear-gradient(140deg,#a0688f,#4a2341)}
.era-3{background:linear-gradient(140deg,#b8794a,#55301a)}
.era-4{background:linear-gradient(140deg,#7f9a5a,#334320)}
.cover-date{flex-direction:column}
.cv-date{display:flex;flex-direction:column;align-items:center;line-height:1;margin-top:-14%}
.cv-date b{font-size:44px;font-weight:800;letter-spacing:-.03em}
.cv-date span{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85;margin-top:4px}
.np-cover .cv-date b{font-size:96px}
.np-cover .cv-date span{font-size:22px}
.cv-year{font-size:13px;font-weight:800;letter-spacing:-.01em}
.mini-cover .cv-year{font-size:12px}
.album-cover .cv-date b{font-size:26px}.album-cover .cv-date span{font-size:9px}.album-cover .cv-date{margin-top:0}
.cover-soft{filter:saturate(.72) brightness(.96)}

/* ═══ Shared round icon button — 44px is the minimum comfortable tap target ═══ */
.icon-btn{
  width:44px;height:44px;border-radius:50%;border:none;background:none;color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  transition:background .15s,transform .1s,opacity .15s;text-decoration:none;-webkit-tap-highlight-color:transparent;
}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(.9)}
.icon-btn:disabled{opacity:.3;cursor:default;background:none;transform:none}
.icon-btn svg{width:26px;height:26px}
.icon-btn.sm svg{width:20px;height:20px}

/* ═══ Mini player — floats above the page, tap anywhere on it to expand ═══ */
.mini-player{
  position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;
  background:var(--elevated);border-radius:12px;display:none;align-items:center;gap:12px;padding:8px 6px 8px 8px;
  z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.35);cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent;
}
.mini-player.open{display:flex}
.mini-cover{width:44px;height:44px;border-radius:7px}
.mini-info{flex:1;min-width:0}
.mini-title{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-sub{font-size:12.5px;color:var(--ink-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini-progress{position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--track);border-radius:1px}
.mini-progress-fill{height:100%;width:0;background:var(--ink);border-radius:1px}

/* ═══ Full player — slides up over everything, slides (or swipes) back down ═══ */
.np-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39;opacity:0;pointer-events:none;transition:opacity .3s}
.np-backdrop.open{opacity:1;pointer-events:auto}
.np{
  position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--np-tint,var(--surface)) 0%,var(--bg) 60%);
  transform:translateY(100%);visibility:hidden;
  transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s linear .34s;
}
.np.open{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s}
.np.dragging{transition:none}
.np-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 4px;flex-shrink:0}
.np-top-mid{flex:1;min-width:0;text-align:center}
.np-top-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light)}
.np-top-parent{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.farb-link{cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent);text-underline-offset:3px}
.farb-link:hover{color:var(--gold)}
.farb-link svg{width:13px;height:13px;vertical-align:-2px}
.np-scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.np-inner{max-width:520px;margin:0 auto;padding:12px 24px calc(40px + env(safe-area-inset-bottom))}
.np-cover{width:min(100%,320px);aspect-ratio:1;margin:12px auto 28px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.np-cover svg{width:34%;height:34%}
.np-cover-label{position:absolute;left:18px;bottom:16px;right:18px;display:flex;justify-content:space-between;align-items:flex-end}
.np-cover-label span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.np-cover-label strong{font-size:22px;font-weight:700;letter-spacing:-.01em;opacity:.95}
.np-title{font-size:22px;font-weight:700;color:var(--ink);line-height:1.25;letter-spacing:-.015em}
.np-sub{font-size:14px;color:var(--ink-light);margin-top:5px}

.seek{position:relative;height:28px;margin-top:20px;cursor:pointer;touch-action:none}
.seek::before{content:'';position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--track)}
.seek-fill{position:absolute;left:0;top:12px;height:4px;border-radius:2px;background:var(--ink);width:0;pointer-events:none}
.seek-thumb{position:absolute;right:-7px;top:-5px;width:14px;height:14px;border-radius:50%;background:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.np-times{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-light);font-variant-numeric:tabular-nums;margin-top:-2px}

.np-controls{display:flex;align-items:center;justify-content:space-between;max-width:340px;margin:14px auto 0}
.np-controls .icon-btn svg{width:28px;height:28px}
.np-play{
  width:68px;height:68px;border-radius:50%;border:none;background:var(--gold);color:#1a1408;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .12s;box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.np-play:active{transform:scale(.93)}
.np-play svg{width:30px;height:30px}
.np-secondary{display:flex;justify-content:center;margin-top:16px}
.speed-btn{
  font:inherit;font-size:13px;font-weight:700;color:var(--ink-mid);background:var(--hover);border:none;
  border-radius:16px;padding:7px 14px;cursor:pointer;font-variant-numeric:tabular-nums;min-width:56px;
}
.speed-btn.on{color:#1a1408;background:var(--gold)}

.np-text-card{background:var(--surface);border-radius:16px;padding:18px 18px 8px;margin-top:32px}
.np-text-label{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:12px}

/* ═══ Topics — one colour per topic group, used on tiles, chips and topic pages ═══ */
.tg-0{--tg:linear-gradient(140deg,#e2b456,#8a5a14)}
.tg-1{--tg:linear-gradient(140deg,#5b86e0,#1f3470)}
.tg-2{--tg:linear-gradient(140deg,#e07a8a,#7a2236)}
.tg-3{--tg:linear-gradient(140deg,#46a872,#1a4c31)}
.tg-4{--tg:linear-gradient(140deg,#e0964a,#7a3f14)}
.tg-5{--tg:linear-gradient(140deg,#a66ae0,#43226b)}
.tg-6{--tg:linear-gradient(140deg,#3fb3b0,#14524f)}
.tg-7{--tg:linear-gradient(140deg,#6f7ee8,#262f80)}
.tg-8{--tg:linear-gradient(140deg,#8f9aa8,#363c45)}
.topic-tile{position:relative;overflow:hidden;border-radius:12px;min-height:84px;padding:13px 14px;color:#fff;cursor:pointer;background:var(--tg);transition:transform .15s;-webkit-tap-highlight-color:transparent}
.topic-tile:hover{transform:translateY(-2px)}
.topic-tile:active{transform:scale(.97)}
.topic-tile strong{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.topic-tile span{display:block;font-size:12px;opacity:.85;margin-top:4px}
.chip.topic-chip{position:relative;padding-left:24px}
.chip.topic-chip::before{content:'';position:absolute;left:11px;top:50%;width:8px;height:8px;border-radius:50%;background:var(--tg);transform:translateY(-50%)}
.res-heading{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin:22px 0 10px}
.res-heading:first-child{margin-top:4px}
.res-sub{font-size:13px;color:var(--ink-light);margin:-6px 0 10px}
.track-summary{font-size:13px;color:var(--ink-mid);line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.topic-hero{border-radius:18px;padding:22px 20px 20px;color:#fff;background:var(--tg);margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.topic-hero .kicker{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.topic-hero h2{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-top:6px}
.topic-hero .he{font-family:'David Libre',serif;font-size:18px;opacity:.9;margin-top:4px}
.topic-hero p{font-size:14.5px;line-height:1.55;opacity:.92;margin-top:10px}
.topic-hero .count{font-size:13px;font-weight:600;opacity:.85;margin-top:12px}
.browse-group{margin-bottom:22px}
.browse-group h4{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:10px}

/* ═══ Reader — full-screen reading view, above the player ═══ */
.reader-backdrop{z-index:44}
.reader{z-index:45}
.reader-inner{max-width:660px;margin:0 auto;padding:6px 22px calc(120px + env(safe-area-inset-bottom))}
.text-size-btn{gap:1px;align-items:baseline;font-weight:700;color:var(--ink)}
.text-size-btn span:first-child{font-size:12px}
.text-size-btn span:last-child{font-size:18px}

.rd-head{margin:10px 0 28px}
.rd-kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light)}
.rd-title{font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.18;color:var(--ink);margin-top:6px}
.rd-badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 11px 5px 9px;border-radius:14px;font-size:12.5px;font-weight:700;color:var(--farb);background:var(--hover)}
.rd-badge svg{width:13px;height:13px}
.rd-badge.neutral{color:var(--ink-mid)}
.rd-kp{margin:14px 0 0 20px;font-size:15px;line-height:1.6;color:var(--ink-mid)}
.rd-kp li{margin-bottom:4px}
.rd-sublabel{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);margin:0 0 10px}
.rd-outline{font-family:'DachHeilig','David Libre',serif;direction:rtl;font-size:calc(var(--rd-size,19px) * .9);line-height:1.9;color:var(--ink-mid);white-space:pre-line;margin-bottom:30px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.rd-summary{font-size:16.5px;line-height:1.65;color:var(--ink-mid);margin-top:14px}
.rd-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.rd-tags .chip{height:30px;padding:0 12px;font-size:13px}
.rd-tags .chip.topic-chip{padding-left:26px}

.rd-text{
  font-family:'DachHeilig','David Libre',serif;direction:rtl;font-size:var(--rd-size,19px);line-height:2;
  color:var(--ink);text-align:justify;text-align-last:right;
}
.rd-text p{margin:0 0 1.05em}
.rd-point{
  font-family:'Inter',sans-serif;font-weight:800;font-size:.68em;color:var(--gold);
  display:inline-block;min-width:1.5em;margin-left:.45em;vertical-align:.12em;
}
.rd-divider{text-align:center;color:var(--gold);letter-spacing:.5em;font-size:12px;margin:1.8em 0;opacity:.85}
.rd-aside{font-size:.86em;color:var(--ink-light);text-align:center !important;text-align-last:center !important}
.fn{
  font-family:'Inter',sans-serif;font-size:.58em;font-weight:800;color:var(--gold);cursor:pointer;
  padding:.1em .22em;margin:0;border-radius:6px;vertical-align:super;line-height:1;transition:background .15s,color .15s;
}
.fn:hover{background:var(--hover)}
.fn.active{background:var(--gold);color:#1a1408}
.rd-notes{margin-top:32px;padding-top:18px;border-top:1px solid var(--border)}
.rd-notes h4{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light);margin-bottom:12px}
.rd-notes ol{list-style:none;padding:0;margin:0;direction:rtl}
.rd-notes li{display:flex;gap:.7em;font-family:'DachHeilig','David Libre',serif;font-size:calc(var(--rd-size,19px) * .8);line-height:1.75;color:var(--ink-mid);margin-bottom:.6em}
.rd-notes li b{font-family:'Inter',sans-serif;font-size:.72em;font-weight:800;color:var(--gold);min-width:1.6em;padding-top:.25em}
.rd-seg-sep{height:1px;background:var(--border);margin:44px 0 34px}
.rd-toc{margin:10px 0 36px}
.rd-toc ol{list-style:none;padding:0;margin:16px 0 0}
.rd-toc a{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--border-soft);color:var(--ink);text-decoration:none;font-size:15.5px;font-weight:600}
.rd-toc a b{font-size:13px;color:var(--gold);min-width:16px}

/* Play bar inside the Reader, for reading along */
.reader-bar{
  position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;
  display:none;align-items:center;gap:10px;background:var(--elevated);border-radius:28px;padding:6px 16px 6px 6px;
  box-shadow:0 8px 26px rgba(0,0,0,.35);z-index:1;
}
.reader-bar.show{display:flex}
.reader-bar-play{width:42px;height:42px;border-radius:50%;border:none;background:var(--gold);color:#1a1408;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.reader-bar-play svg{width:20px;height:20px}
.reader-bar-title{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-bar-time{font-size:12px;color:var(--ink-light);font-variant-numeric:tabular-nums;flex-shrink:0}

/* Footnote sheet — slides up over the bottom of the Reader */
.fn-sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:2;max-width:700px;margin:0 auto;background:var(--elevated);
  border-radius:18px 18px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.35);padding:8px 20px calc(22px + env(safe-area-inset-bottom));
  max-height:52vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
}
.fn-sheet.open{transform:none}
.fn-sheet-head{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.fn-sheet-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-light)}
.fn-sheet-text{overflow-y:auto;font-family:'DachHeilig','David Libre',serif;font-size:calc(var(--rd-size,19px) * .92);line-height:1.85;color:var(--ink);padding:2px 0 4px}
.fn-sheet-text.missing{font-family:'Inter',sans-serif;direction:ltr;font-size:14px;color:var(--ink-light)}

/* Preview card in the full player */
.pv-summary{font-size:15px;line-height:1.6;color:var(--ink-mid);margin-top:10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.pv-excerpt{
  font-family:'DachHeilig','David Libre',serif;font-size:18px;line-height:1.9;color:var(--ink);margin-top:16px;
  max-height:5.7em;overflow:hidden;text-align:justify;
  -webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent);
}
.pv-btn{
  display:block;width:100%;height:46px;border-radius:23px;border:none;margin-top:16px;cursor:pointer;
  background:var(--ink);color:var(--bg);font:inherit;font-size:15px;font-weight:700;transition:transform .12s;
}
.pv-btn:active{transform:scale(.98)}
.pv-btn.ghost{background:var(--hover);color:var(--ink)}
.pv-note{font-size:14.5px;line-height:1.6;color:var(--ink-light)}
.np-text-card .rd-badge{margin-top:0}
</style>
</head>
<body>

<header id="appHeader">
  <div class="header-inner">
    <div class="appbar">
      <div class="wordmark" onclick="goHome()" title="Back to home">
        <div class="wordmark-icon">
          <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="currentColor"><path d="M70 382Q47 403 35.0 427.0Q23 451 21 476Q19 499 24.0 520.0Q29 541 38.5 559.5Q48 578 60.5 593.5Q73 609 85 620H96Q94 585 106.0 559.5Q118 534 145 511L329 354L376 420L342 449Q326 463 320.0 483.5Q314 504 319 527Q327 560 349.0 584.5Q371 609 385 620H395Q395 602 400.5 592.5Q406 583 423 570L465 536Q491 515 493.5 489.0Q496 463 486 434Q483 425 477.0 415.0Q471 405 464.5 396.0Q458 387 451.5 379.5Q445 372 440 366L394 405L348 338L429 269Q459 244 479.5 211.0Q500 178 499 133Q498 101 486.5 66.0Q475 31 455 5H439Q437 25 433.5 40.0Q430 55 420.0 70.0Q410 85 392.0 103.0Q374 121 343 148L134 327Q120 307 114.5 289.5Q109 272 108 260Q108 249 111.5 238.5Q115 228 122.0 218.0Q129 208 139.5 197.5Q150 187 164 176Q178 165 190.5 155.5Q203 146 212.0 134.5Q221 123 226.0 109.0Q231 95 232 75Q234 37 216.0 17.0Q198 -3 162 -2Q147 -2 135.5 -1.0Q124 0 112.5 0.5Q101 1 89.0 0.5Q77 0 61 -3Q47 -5 44.0 -2.0Q41 1 39 8Q53 10 57.0 16.5Q61 23 59 36Q55 56 45.0 82.5Q35 109 31 136Q27 165 33.0 193.0Q39 221 51.5 247.5Q64 274 80.5 298.5Q97 323 114 344Z" transform="translate(15.365 52.744) scale(0.06410 -0.06410)"/></g></svg>
        </div>
        <div class="wordmark-text">
          <h1>Ashreinu</h1>
          <span id="todayStrip">Archive Search</span>
        </div>
      </div>
      <div class="appbar-actions">
        <button class="icon-btn sm" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Switch light or dark mode" title="Light / dark">
          <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <button class="browse-btn" onclick="openBrowseSheet()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Browse
        </button>
      </div>
    </div>
    <div class="search-box" id="searchBox">
      <span class="search-icon" id="searchIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="search" id="q" placeholder="Search sichos, topics, dates…" autocomplete="off" enterkeyhint="search" />
      <button class="icon-btn sm search-clear" onclick="clearSearch()" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="chips filters-row-wrap" id="filterRow">
      <button class="chip active" data-type="" onclick="setType('',this)">All</button>
      <button class="chip" data-type="sicha" onclick="setType('sicha',this)">Sichos</button>
      <button class="chip" data-type="maamar" onclick="setType('maamar',this)">Ma'amarim</button>
      <button class="chip" data-type="nigun" onclick="setType('nigun',this)">Niggunim</button>
      <span class="chip-divider"></span>
      <label class="chip chip-select" id="yearChip"><select id="yf" onchange="search()" aria-label="Year"><option value="">Year</option></select></label>
      <label class="chip chip-select" id="monthChip"><select id="mf" onchange="search()" aria-label="Month">
        <option value="">Month</option>
        <option>Tishrei</option><option>Cheshvan</option><option>Kislev</option>
        <option>Tevet</option><option>Shevat</option><option>Adar</option>
        <option>Nissan</option><option>Iyar</option><option>Sivan</option>
        <option>Tammuz</option><option>Av</option><option>Elul</option>
      </select></label>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="rmeta"></div>
  <div id="res"></div>
</div>

<div class="mini-player" id="playerBar" onclick="openNowPlaying()">
  <div class="mini-cover cover" id="miniCover"></div>
  <div class="mini-info">
    <div class="mini-title" id="playerTitle"></div>
    <div class="mini-sub" id="playerSub"></div>
  </div>
  <button class="icon-btn" id="playerBtn" onclick="event.stopPropagation();togglePlayPause()" aria-label="Play or pause">
    <svg id="playerIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="icon-btn sm" onclick="event.stopPropagation();closePlayer()" aria-label="Stop and close player">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <div class="mini-progress"><div class="mini-progress-fill" id="playerFill"></div></div>
</div>
<audio id="audioEl"></audio>

<div class="np-backdrop" id="npBackdrop" onclick="closeNowPlaying()"></div>
<div class="np" id="npOverlay" role="dialog" aria-label="Now playing">
  <div class="np-top">
    <button class="icon-btn" onclick="closeNowPlaying()" aria-label="Minimize player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="np-top-mid">
      <div class="np-top-label">Playing from</div>
      <div class="np-top-parent" id="npParent"></div>
    </div>
    <a class="icon-btn sm" id="npExt" target="_blank" rel="noopener" aria-label="Open in Ashreinu" title="Open in Ashreinu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
  </div>
  <div class="np-scroll" id="npScroll">
    <div class="np-inner">
      <div class="np-cover cover" id="npCover"></div>
      <div class="np-title" id="npTitle"></div>
      <div class="np-sub" id="npSub"></div>

      <div class="seek" id="npSeek"><div class="seek-fill" id="npFill"><div class="seek-thumb"></div></div></div>
      <div class="np-times"><span id="npCur">0:00</span><span id="npDur">0:00</span></div>

      <div class="np-controls">
        <button class="icon-btn" id="npPrevBtn" onclick="playPrev()" aria-label="Previous track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="icon-btn" onclick="skipBy(-15)" aria-label="Back 15 seconds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><text x="12.2" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,sans-serif">15</text></svg>
        </button>
        <button class="np-play" id="npPlayBtn" onclick="togglePlayPause()" aria-label="Play or pause">

        </button>
        <button class="icon-btn" onclick="skipBy(15)" aria-label="Forward 15 seconds">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/><text x="11.8" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="Inter,sans-serif">15</text></svg>
        </button>
        <button class="icon-btn" id="npNextBtn" onclick="playNext()" aria-label="Next track">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="np-secondary">
        <button class="speed-btn" id="speedBtn" onclick="cycleSpeed()" aria-label="Playback speed">1×</button>
      </div>

      <div class="np-text-card">
        <div class="np-text-label">Source text</div>
        <div id="npReadContent"></div>
      </div>
    </div>
  </div>
</div>

<div class="np-backdrop reader-backdrop" id="readerBackdrop" onclick="closeReader()"></div>
<div class="np reader" id="reader" role="dialog" aria-label="Source text">
  <div class="np-top">
    <button class="icon-btn" onclick="closeReader()" aria-label="Close reader">

</div>

<div class="sheet-backdrop" id="browseBackdrop" onclick="closeBrowseSheet()"></div>
<div class="sheet" id="browseSheet" role="dialog" aria-label="Browse the archive">
  <div class="sheet-handle-row"><div class="sheet-handle"></div></div>
  <div class="sheet-topbar">
    <span class="sheet-title">Browse</span>
    <button class="icon-btn sm" onclick="closeBrowseSheet()" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="sheet-scroll" id="browseScroll">
    <div class="browse-tabs">
      <button class="chip active" data-pane="collections" onclick="switchBrowseTab('collections')">Occasions</button>
      <button class="chip" data-pane="topics" onclick="switchBrowseTab('topics')">Topics</button>
      <button class="chip" data-pane="years" onclick="switchBrowseTab('years')">Years</button>
      <button class="chip" data-pane="months" onclick="switchBrowseTab('months')">Months</button>
      <button class="chip" data-pane="type" onclick="switchBrowseTab('type')">Type</button>
    </div>
    <div class="browse-pane active" id="pane-collections"><div class="card-grid" id="browseCollectionsGrid"></div></div>
    <div class="browse-pane" id="pane-topics"><div class="tile-grid" id="browseTopics"></div></div>
    <div class="browse-pane" id="pane-type"><div class="tile-grid" id="browseTypeGrid"></div></div>
    <div class="browse-pane" id="pane-months"><div class="card-grid" id="browseMonthsGrid"></div></div>
    <div class="browse-pane" id="pane-years"><div class="chip-wrap" id="browseYearsScroll"><div class="shelf-empty">Loading…</div></div></div>
  </div>
</div>

<script>
let currentType = '';
let currentDates = null; // active collection filter: [[month,day], ...] or null
let debounceTimer = null;

// ── Occasions: named days mapped to their Hebrew date(s), any year.
// Month numbers follow Ashreinu's 13-month scheme (see HEBCAL_MONTH_MAP).
// Each window also covers the recorded days around it: the Rebbe didn't
// record on Shabbos or Yom Tov, so e.g. Simchas Torah's audio is from Motzaei
// Simchas Torah and Isru Chag. `tag` is the catalogue's name for the occasion
// (talks ABOUT it, said on any date); `kind` groups the Occasions menu.
// Seasons are browse-only: "Now: Elul" for a whole month isn't news.
function dayRange(m, from, to) { const out = []; for (let d = from; d <= to; d++) out.push([m, d]); return out; }
const COLLECTIONS = [
  { name: "Rosh Hashanah", sub: "29 Elul – 2 Tishrei", kind: 'yomtov', tag: 'Rosh Hashanah', dates: [[13,29],[1,1],[1,2]] },
  { name: "Tzom Gedalyah", sub: "3–4 Tishrei", kind: 'fast', dates: [[1,3],[1,4]] },
  { name: "Yom Kippur", sub: "9–10 Tishrei", kind: 'yomtov', tag: 'Yom Kippur', dates: [[1,9],[1,10]] },
  { name: "Yud-Gimmel Tishrei", sub: "13 Tishrei", kind: 'chassidic', dates: [[1,13]] },
  { name: "Sukkos", sub: "14–21 Tishrei", kind: 'yomtov', tag: 'Sukkos', dates: dayRange(1, 14, 21) },
  { name: "Shmini Atzeres & Simchas Torah", sub: "22–24 Tishrei", kind: 'yomtov', tag: 'Shmini Atzeres & Simchas Torah', dates: dayRange(1, 22, 24) },
  { name: "Chof Cheshvan", sub: "20 Cheshvan", kind: 'chassidic', dates: [[2,20]] },
  { name: "Yud Kislev", sub: "10 Kislev", kind: 'chassidic', tag: 'Yud Kislev', dates: [[3,10]] },
  { name: "Yud-Daled Kislev", sub: "14 Kislev", kind: 'chassidic', tag: 'Yud-Daled Kislev', dates: [[3,14]] },
  { name: "Yud-Tes Kislev", sub: "19–20 Kislev", kind: 'chassidic', tag: 'Yud-Tes Kislev', dates: [[3,19],[3,20]] },
  { name: "Chanukah", sub: "25 Kislev – 3 Teves", kind: 'yomtov', tag: 'Chanukah', dates: [...dayRange(3, 25, 30), ...dayRange(4, 1, 3)] },
  { name: "Hei Teves", sub: "5 Teves", kind: 'chassidic', tag: 'Hei Teves', dates: [[4,5]] },
  { name: "Asara B'Teves", sub: "10 Teves", kind: 'fast', dates: [[4,10]] },
  { name: "Yud Shevat", sub: "10 Shevat", kind: 'chassidic', tag: 'Yud Shevat', dates: [[5,10]] },
  { name: "Tu BiShvat", sub: "15 Shevat", kind: 'yomtov', tag: 'Tu BiShvat', dates: [[5,15]] },
  { name: "Chof-Beis Shevat", sub: "22 Shevat", kind: 'chassidic', tag: 'Chof-Beis Shevat', dates: [[5,22]] },
  { name: "Purim", sub: "13–15 Adar", kind: 'yomtov', tag: 'Purim', dates: [[7,13],[7,14],[7,15]] },
  { name: "Yud-Alef Nissan", sub: "11 Nissan", kind: 'chassidic', tag: 'Yud-Alef Nissan', dates: [[8,11]] },
  { name: "Yud-Gimmel Nissan", sub: "13 Nissan", kind: 'chassidic', tag: 'Yud-Gimmel Nissan', dates: [[8,13]] },
  { name: "Pesach", sub: "14–22 Nissan", kind: 'yomtov', tag: 'Pesach', dates: dayRange(8, 14, 22) },
  { name: "Sefiras HaOmer", sub: "16 Nissan – 5 Sivan", kind: 'season', tag: 'Sefiras HaOmer', dates: [...dayRange(8, 16, 30), ...dayRange(9, 1, 29), ...dayRange(10, 1, 5)] },
  { name: "Pesach Sheini", sub: "14 Iyar", kind: 'yomtov', tag: 'Pesach Sheini', dates: [[9,14]] },
  { name: "Lag BaOmer", sub: "18 Iyar", kind: 'yomtov', tag: 'Lag BaOmer', dates: [[9,18]] },
  { name: "Shavuos", sub: "5–7 Sivan", kind: 'yomtov', tag: 'Shavuos', dates: dayRange(10, 5, 7) },
  { name: "Chof-Ches Sivan", sub: "28 Sivan", kind: 'chassidic', tag: 'Chof-Ches Sivan', dates: [[10,28]] },
  { name: "Gimmel Tammuz", sub: "3 Tammuz", kind: 'chassidic', tag: 'Gimmel Tammuz', dates: [[11,3]] },
  { name: "Yud-Beis Tammuz", sub: "12–13 Tammuz", kind: 'chassidic', tag: 'Yud-Beis Tammuz', dates: [[11,12],[11,13]] },
  { name: "Shiva Asar B'Tammuz", sub: "17 Tammuz", kind: 'fast', tag: "The Three Weeks & Tisha B'Av", dates: [[11,17],[11,18]] },
  { name: "The Three Weeks", sub: "17 Tammuz – 9 Av", kind: 'season', tag: "The Three Weeks & Tisha B'Av", dates: [...dayRange(11, 17, 29), ...dayRange(12, 1, 10)] },
  { name: "Tisha B'Av", sub: "9 Av", kind: 'fast', tag: "The Three Weeks & Tisha B'Av", dates: [[12,9],[12,10]] },
  { name: "Tu B'Av", sub: "15 Av", kind: 'yomtov', tag: "Tu B'Av", dates: [[12,15]] },
  { name: "Chof Av", sub: "20 Av", kind: 'chassidic', tag: 'Chof Av', dates: [[12,20]] },
  { name: "Elul", sub: "The whole month", kind: 'season', tag: 'Elul', dates: dayRange(13, 1, 29) },
  { name: "Chai Elul", sub: "18 Elul", kind: 'chassidic', tag: 'Chai Elul', dates: [[13,18]] },
];

function getAudioUrl(row) {
  if (!row.audio_uri) return null;
  const opusUri = row.audio_uri.replace(/\.mp3$/i, '.opus');
  return '/api/proxy?audio=' + encodeURIComponent(opusUri);
}
function dur(ms) {
  if (!ms) return '';
  const s = Math.round(ms / 1000);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function dstr(row) {
  const h = row.hebrew_day ? row.hebrew_day+' '+row.hebrew_month_name+' '+row.hebrew_year : '';
  const s = row.secular_year
    ? new Date(row.secular_year,(row.secular_month||1)-1,row.secular_day||1)
        .toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'})
    : '';
  return [h,s].filter(Boolean).join(' · ');
}
function typeDot(t) {
  const l=(t||'').toLowerCase();
  if(l.includes('sicha'))  return 'dot-sicha';
  if(l.includes('maamar')||l.includes("ma'amar")) return 'dot-maamar';
  if(t==='Farbrengen')     return 'dot-farb';
  if(l.includes('nigun')) return 'dot-niggun';
  return 'dot-other';
}
function typeLabel(t) {
  return (t||'').replace('Farbrengen – ','').replace(' to Group','');
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function lnk(row) {
  const parentId = row.parent_id || row.id;
  return 'https://ashreinu.app/player?parentEvent='+parentId+'&event='+row.id;
}

const clockIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>';
const calIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
const extIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';
const playIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const bookIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';

// ── Theme (dark default, light opt-in) ──
function applyTheme(theme) {
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeIconMoon').style.display = 'none';
    document.getElementById('themeIconSun').style.display = '';
  } else {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeIconMoon').style.display = '';
    document.getElementById('themeIconSun').style.display = 'none';
  }
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = current === 'light' ? 'dark' : 'light';
  localStorage.setItem('ashreinu-theme', next);
  applyTheme(next);
}
function initTheme() {
  const saved = localStorage.getItem('ashreinu-theme');
  applyTheme(saved === 'light' ? 'light' : 'dark'); // dark unless the person has explicitly chosen light before
}

// ── Years in the archive: fetched once, shared by the year chip, the home
// "By year" row and the Browse sheet ──
let yearsPromise = null;
function getYears() {
  if (!yearsPromise) {
    yearsPromise = fetch('/api/search?distinct=years')
      .then(r => r.json()).then(j => j.years || [])
      .catch(() => { yearsPromise = null; return []; });
  }
  return yearsPromise;
}

// ── Type tiles: shared by the home screen and the Browse sheet ──
const TYPE_TILES = [
  { label: 'Sichos', key: 'sicha', type: 'sicha' },
  { label: "Ma'amarim", key: 'maamar', type: 'maamar' },
  { label: 'Niggunim', key: 'niggun', type: 'nigun' },
  { label: 'Farbrengens', key: 'farb', type: 'farbrengen' },
];
function typeTilesHtml(inSheet) {
  return TYPE_TILES.map(t =>
    '<div class="type-tile cover-' + t.key + '" onclick="' + (inSheet ? 'closeBrowseSheet();' : '') + 'browseByType(\'' + t.type + '\')">'
      + t.label
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + TYPE_ICONS[t.key] + '</svg>'
    + '</div>').join('');
}

// ── Browse sheet (consolidates Type/Occasions/Months/Years — one place,
// opened on demand, instead of spreading everything across the landing page) ──
function browseIsOpen() { return document.getElementById('browseSheet').classList.contains('open'); }
function openBrowseSheet(tab) {
  if (!browseIsOpen()) {
    document.getElementById('browseScroll').scrollTop = 0;
    // A history entry means the phone's Back button closes the sheet.
    if (!history.state?.browse) history.pushState({ browse: true }, '');
  }
  document.getElementById('browseSheet').classList.add('open');
  document.getElementById('browseBackdrop').classList.add('open');
  switchBrowseTab(tab || 'collections');
  loadBrowseSheetContent();
}
function closeBrowseSheet(fromBackButton) {
  if (!browseIsOpen()) return;
  document.getElementById('browseSheet').classList.remove('open');
  document.getElementById('browseBackdrop').classList.remove('open');
  if (!fromBackButton) popOwnHistory('browse');
}
function switchBrowseTab(pane) {
  document.querySelectorAll('.browse-tabs .chip').forEach(t => t.classList.toggle('active', t.dataset.pane === pane));
  document.querySelectorAll('.browse-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + pane));
}
let browseStaticLoaded = false;
async function loadBrowseSheetContent() {
  // Types, occasions and months are fixed lists — build them once.
  if (!browseStaticLoaded) {
    browseStaticLoaded = true;
    document.getElementById('browseTypeGrid').innerHTML = typeTilesHtml(true);
    // One list in calendar order, Tishrei to Elul.
    document.getElementById('browseCollectionsGrid').innerHTML = COLLECTIONS.map((c, i) =>
      '<div class="occasion" onclick="closeBrowseSheet();browseByCollection(' + i + ')"><strong>' + esc(c.name) + '</strong><span>' + esc(c.sub) + '</span></div>').join('');
    document.getElementById('browseMonthsGrid').innerHTML = MONTH_LIST.map(m =>
      '<div class="occasion" onclick="closeBrowseSheet();browseByMonth(\'' + m + '\')"><strong>' + m + '</strong></div>').join('');
  }
  // Nine calm category tiles, like a music app's browse grid; each group's
  // page shows its sub-topics.
  document.getElementById('browseTopics').innerHTML = TOPICS.length
    ? topicTilesHtml(false)
    : '<div class="shelf-empty">Topics will appear once the catalogue is set up.</div>';
  const years = await getYears();
  document.getElementById('browseYearsScroll').innerHTML = years.length
    ? years.map(y => '<button class="chip" onclick="closeBrowseSheet();browseByYear(' + y + ')">' + y + '</button>').join('')
    : '<div class="shelf-empty">No years indexed yet.</div>';
}

function goHome() {
  currentType = '';
  currentDates = null;
  document.getElementById('q').value = '';
  document.getElementById('yf').value = '';
  document.getElementById('mf').value = '';
  document.querySelectorAll('.chip[data-type]').forEach(el => el.classList.remove('active'));
  document.querySelector('.chip[data-type=""]')?.classList.add('active');
  document.getElementById('filterRow').classList.remove('active');
  syncSearchClear(); syncFilterChips();
  showLanding();
}

function setType(t, el) {
  currentType = t;
  currentDates = null;
  document.querySelectorAll('.chip[data-type]').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  search();
}
function quickSearch(term) {
  currentDates = null;
  document.getElementById('q').value = term;
  search();
}
function debouncedSearch() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(search, 350);
}

let searchToken = 0;
async function search() {
  syncSearchClear();
  const q  = document.getElementById('q').value.trim();
  const yf = document.getElementById('yf').value;
  const mf = document.getElementById('mf').value;

  if (!q && !currentType && !yf && !mf && !currentDates) {
    document.getElementById('filterRow').classList.remove('active');
    showLanding();
    return;
  }
  document.getElementById('filterRow').classList.add('active');
  syncFilterChips();

  const myToken = ++searchToken;
  document.getElementById('searchIcon').classList.add('loading');
  showSkeletons();

  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (currentType) params.set('type', currentType);
  if (yf) params.set('year', yf);
  if (mf) params.set('month', mf);
  if (currentDates) params.set('dates', JSON.stringify(currentDates));
  const occasionTag = currentDates ? document.getElementById('rmeta').dataset.collectionTag : '';
  if (occasionTag) params.set('occasion', occasionTag);

  try {
    const r = await fetch('/api/search?' + params.toString());
    const j = await r.json();
    if (myToken !== searchToken) return;
    document.getElementById('searchIcon').classList.remove('loading');

    if (j.error) {
      document.getElementById('rmeta').textContent = 'Error: ' + j.error;
      document.getElementById('res').innerHTML = '';
      return;
    }

    const results = j.results || [];
    const talks = j.talks || [];
    const collectionName = currentDates ? document.getElementById('rmeta').dataset.collectionName : null;
    document.getElementById('rmeta').textContent =
      (talks.length ? talks.length + ' talk' + (talks.length !== 1 ? 's' : '') + ' · ' : '') +
      results.length + ' track' + (results.length !== 1 ? 's' : '') + ' by name or date' +
      (results.length >= 200 ? ' (first 200)' : '') +
      (collectionName ? ' for ' + collectionName : (q ? ' for "' + q + '"' : ''));

    // Topics first (the ones the query named, plus name/alias matches), then
    // the ranked catalogue "Talks", then farbrengens and tracks by name/date.
    const topicHits = [...(j.matchedTopics || []), ...suggestTopics(q)]
      .filter((t, i, a) => a.findIndex(x => x.slug === t.slug) === i).slice(0, 6);
    const before = (topicHits.length ? '<div class="chip-scroll" style="margin:0 -16px 6px">' + topicHits.map(topicChipHtml).join('') + '</div>' : '')
      + (talks.length ? '<h3 class="res-heading">Talks</h3>' + talks.map(t => trackRowHtml(t, true, true)).join('') : '');
    renderCards(results, before);
  } catch (e) {
    document.getElementById('searchIcon').classList.remove('loading');
    document.getElementById('rmeta').textContent = 'Search failed: ' + e.message;
  }
}

// ── Hebrew calendar awareness ──
// Ashreinu numbers months 1–13 and always reserves 6 for Adar I, even in
// non-leap years: plain Adar (and Adar II) is 7, Nissan 8 ... Elul 13.
// Verified against real Ashreinu events (e.g. 12 Nissan 5747 → month 8).
const HEBCAL_MONTH_MAP = {
  'Tishrei':1,'Cheshvan':2,'Kislev':3,'Tevet':4,"Sh'vat":5,'Shevat':5,
  'Adar I':6,'Adar':7,'Adar II':7,'Nisan':8,'Nissan':8,'Iyyar':9,'Iyar':9,
  'Sivan':10,'Tamuz':11,'Tammuz':11,'Av':12,'Elul':13
};
let todayHebrew = null; // { year, month, day, monthName, displayStr }

async function loadTodayHebrewDate() {
  try {
    const now = new Date();
    const gy = now.getFullYear(), gm = now.getMonth()+1, gd = now.getDate();
    const r = await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${gy}&gm=${gm}&gd=${gd}&g2h=1`);
    const j = await r.json();
    if (!(j.hd && j.hm && j.hy)) return; // unexpected answer: keep "Archive Search"
    const monthNum = HEBCAL_MONTH_MAP[j.hm] || null;
    todayHebrew = { year: j.hy, month: monthNum, day: j.hd, monthName: j.hm };
    document.getElementById('todayStrip').textContent = j.hd + ' ' + j.hm + ' ' + j.hy;
  } catch (e) { /* keep the default "Archive Search" subtitle */ }
}

const MONTH_LIST = ['Tishrei','Cheshvan','Kislev','Tevet','Shevat','Adar','Nissan','Iyar','Sivan','Tammuz','Av','Elul'];

// Where an occasion stands relative to today. Treats every Hebrew month as
// 30 days, which is plenty to rank occasions by how soon they come; the only
// labels shown from it are "Now" (today is one of its days), "Today" and
// "Tomorrow" (same or next day), which the approximation gets right.
function approxOrdinal(month, day) { return month * 30 + day; }
function occasionTiming(c) {
  const today = approxOrdinal(todayHebrew.month, todayHebrew.day);
  const diffs = c.dates.map(([m, d]) => ((approxOrdinal(m, d) - today) % 390 + 390) % 390);
  const now = diffs.includes(0);
  // For "now", how far into it we are doesn't matter; otherwise days to its first day.
  return { now, diff: now ? 0 : Math.min(...diffs), started: now && c.dates.length > 1 && !(c.dates[0][0] === todayHebrew.month && c.dates[0][1] === todayHebrew.day) };
}
function getUpcomingCollections(count) {
  if (!todayHebrew || !todayHebrew.month) return [];
  return COLLECTIONS
    .filter(c => c.kind !== 'season')
    .map(c => ({ ...c, ...occasionTiming(c) }))
    .sort((a, b) => a.diff - b.diff || (b.now - a.now))
    .slice(0, count);
}
function occasionHeading(c) {
  if (c.now) return (c.started ? 'Now: ' : 'Today: ') + c.name;
  if (c.diff === 1) return 'Tomorrow: ' + c.name;
  return 'Coming up: ' + c.name;
}

// ── "Continue listening": recently played tracks + where you stopped in each.
// Stored only on this device (localStorage). Every read/write is wrapped,
// because storage can be blocked (private browsing) — the app must still work.
const RECENT_KEY = 'ashreinu-recent', POS_KEY = 'ashreinu-pos';
const RECENT_FIELDS = ['id','name','type','parent_id','parent_name','hebrew_year','hebrew_month','hebrew_day','hebrew_month_name',
  'secular_year','secular_month','secular_day','duration_ms','audio_uri','confirmed_title','main_topic','summary_en','photo','photo_lg'];
function readJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
}
function rememberPlay(row) {
  const slim = Object.fromEntries(RECENT_FIELDS.map(k => [k, row[k] ?? null]));
  const list = readJSON(RECENT_KEY, []).filter(r => String(r.id) !== String(row.id));
  list.unshift(slim);
  writeJSON(RECENT_KEY, list.slice(0, 12));
}
function getRecent() { return readJSON(RECENT_KEY, []); }
function savedPosition(id) { return readJSON(POS_KEY, {})[id] || 0; }
function savePosition(id, seconds) {
  if (!id) return;
  const all = readJSON(POS_KEY, {});
  if (seconds > 0) all[id] = Math.floor(seconds); else delete all[id];
  writeJSON(POS_KEY, all);
}

// ── Home cards ──
function shelfSkeleton(n) {
  let html = '';
  for (let i = 0; i < (n || 4); i++) html += '<div class="skel-shelf"><div class="skel-cover"></div><div class="skel-line title"></div><div class="skel-line meta"></div></div>';
  return html;
}
function progressPct(row) {
  const total = row.duration_ms ? row.duration_ms / 1000 : 0;
  return total ? Math.min(100, savedPosition(row.id) / total * 100) : 0;
}
// True for a farbrengen, or any event whose audio is in tracks inside it.
function opensAsAlbum(row) { return row.type === 'Farbrengen' || !row.audio_uri; }
function cardAction(row) { return opensAsAlbum(row) ? 'openFarbrengen(' + row.id + ')' : 'playFromOrder(\'' + row.id + '\')'; }
// One square card for any row (shelves): a farbrengen opens as an album, a
// single recording plays (and resumes) on tap.
function cardHtml(row) {
  rowsById[String(row.id)] = row;
  const pct = opensAsAlbum(row) ? 0 : progressPct(row);
  return '<div class="shelf-card" onclick="' + cardAction(row) + '">'
    + coverHtml('shelf-cover', row, true)
    + '<div class="shelf-title">' + esc(trackTitle(row)) + '</div>'
    + '<div class="shelf-sub">' + esc(hebDate(row) || row.secular_year || '') + '</div>'
    + (pct > 0 ? '<div class="shelf-progress"><i style="width:' + pct.toFixed(1) + '%"></i></div>' : '')
  + '</div>';
}
// "Jump back in": a compact tile (small cover + title), like Spotify's shortcuts.
function jumpCardHtml(row) {
  rowsById[String(row.id)] = row;
  const pct = progressPct(row);
  return '<div class="jump-card" onclick="' + cardAction(row) + '">'
    + coverHtml('jump-cover', row, false)
    + '<div class="jump-title">' + esc(trackTitle(row)) + '</div>'
    + (pct > 0 ? '<div class="jump-progress"><i style="width:' + pct.toFixed(1) + '%"></i></div>' : '')
  + '</div>';
}
// "Talks to explore": a wide episode card (title, one-line topic and date,
// summary), like a podcast episode, for catalogued talks.
function episodeCardHtml(row) {
  rowsById[String(row.id)] = row;
  return '<div class="ep-card" onclick="playFromOrder(\'' + row.id + '\')">'
    + '<div class="ep-head">' + coverHtml('ep-cover', row, false)
      + '<div class="ep-meta"><b>' + esc(row.main_topic ? topicName(row.main_topic) : typeLabel(row.type)) + '</b><span>' + esc([hebDate(row), dur(row.duration_ms)].filter(Boolean).join(' · ')) + '</span></div></div>'
    + '<div class="ep-title">' + esc(trackTitle(row)) + '</div>'
    + (row.summary_en ? '<div class="ep-summary">' + esc(row.summary_en) + '</div>' : '')
  + '</div>';
}

// Home answers one question: what to listen to now. At most four calm
// sections, most personal first: your own listening, today, something new,
// then topics. Browsing by type, year or occasion lives in the Browse sheet.
async function showLanding() {

// Every recorded event (farbrengen, Kos Shel Brachah, rally, sicha...) held on
// any of the given [month, day] dates, any year, plus, when the occasion has
// a catalogue name, the talks tagged with it. Main events first (farbrengens,
// then sichos and the like, then davening), newest year first within each.
function eventRank(row) {
  const t = (row.type || '').toLowerCase();
  if (t === 'farbrengen') return 0;
  if (/shacharis|minchah|ma.ariv|maftir|prayer|hataras|kidush levanah/.test(t)) return 2;
  return 1;
}
async function fetchEventsOn(dates, occasionTag) {
  const params = new URLSearchParams({ toplevel: '1', limit: '300', dates: JSON.stringify(dates) });
  if (occasionTag) params.set('occasion', occasionTag);
  const j = await (await fetch('/api/search?' + params)).json();
  if (j.error) throw new Error(j.error);
  const rows = (j.results || []).sort((a, b) => eventRank(a) - eventRank(b) || (b.hebrew_year || 0) - (a.hebrew_year || 0));
  return { rows, talks: j.talks || [] };
}
// "Today": one section, one shelf. An occasion happening now; otherwise
// what was recorded on this date; otherwise the next occasion that has
// recordings. Catalogued talks about it come first, then the recordings.
async function loadToday() {
  if (!todayHebrew || !todayHebrew.month) return;
  const upcoming = getUpcomingCollections(8);
  const idxOf = c => COLLECTIONS.findIndex(x => x.name === c.name);
  const show = (heading, sub, seeAll, found) => {
    const section = document.getElementById('todaySection');
    if (!section) return true; // user navigated away
    const seen = new Set();
    const items = [...found.talks, ...found.rows].filter(r => !seen.has(r.id) && seen.add(r.id)).slice(0, 20);
    if (!items.length) return false;
    section.innerHTML = '<div class="home-section-head"><h3>' + esc(heading) + '</h3>'
        + (seeAll ? '<button class="see-all" onclick="' + seeAll + '">See all</button>' : '') + '</div>'
      + '<div class="home-sub">' + esc(sub) + '</div>'
      + '<div class="shelf">' + items.map(cardHtml).join('') + '</div>';
    section.style.display = 'block';
    return true;
  };
  try {
    for (const c of upcoming.filter(c => c.now)) {
      if (show(occasionHeading(c), c.sub + ', across the years', 'browseByCollection(' + idxOf(c) + ')', await fetchEventsOn(c.dates, c.tag))) return;
    }
    const day = await fetchEventsOn([[todayHebrew.month, todayHebrew.day]]);
    if (show('On this day', todayHebrew.day + ' ' + todayHebrew.monthName + ', across the years', null, day)) return;
    for (const c of upcoming.filter(c => !c.now)) {
      if (show(occasionHeading(c), c.sub + ', across the years', 'browseByCollection(' + idxOf(c) + ')', await fetchEventsOn(c.dates, c.tag))) return;
    }
  } catch (e) { /* leave hidden */ }
}

// A shuffled handful of catalogued talks (real titles and summaries).
async function loadExplore() {

    const section = document.getElementById('exploreSection');

// Open one farbrengen as an album page with all its tracks.
// ── Topics (the browsing menu) ──
let TOPICS = [], TOPIC_BY_SLUG = {};
async function loadTopicList() {
  try {
    const j = await (await fetch('/api/search?topics=1')).json();
    TOPICS = j.topics || [];
    TOPIC_BY_SLUG = Object.fromEntries(TOPICS.map(t => [t.slug, t]));
  } catch (e) { /* topics not set up yet: the app works without them */ }
}
function topicName(slug) { return TOPIC_BY_SLUG[slug]?.name_en || ''; }
function topicGroups() { return TOPICS.filter(t => !t.parent_slug); }
function groupIndex(slug) {
  const t = TOPIC_BY_SLUG[slug];
  const g = t?.parent_slug || slug;
  return Math.max(0, topicGroups().findIndex(x => x.slug === g)) % 9;
}
function topicCount(t) {
  return t.parent_slug ? (t.count || 0) : TOPICS.filter(c => c.parent_slug === t.slug).reduce((a, c) => a + (c.count || 0), 0);
}
// Topics whose name or alias starts with what's typed ("teshu" → Teshuvah).
function suggestTopics(q) {
  const n = String(q || '').toLowerCase().trim();
  if (n.length < 2) return [];
  return TOPICS.filter(t => t.parent_slug && [t.name_en, t.name_he, ...(t.aliases || [])]
    .some(a => a && (a.toLowerCase().startsWith(n) || (n.length >= 4 && a.toLowerCase().includes(n))))).slice(0, 6);
}
function topicChipHtml(t) {
  return '<button class="chip topic-chip tg-' + groupIndex(t.slug) + '" onclick="openTopic(\'' + t.slug + '\')">' + esc(t.name_en) + '</button>';
}
function topicTilesHtml(onlyWithTalks) {
  return topicGroups().filter(g => !onlyWithTalks || topicCount(g) > 0).map(g =>
    '<div class="topic-tile tg-' + groupIndex(g.slug) + '" onclick="openTopic(\'' + g.slug + '\')"><strong>' + esc(g.name_en) + '</strong>'
    + '<span>' + (topicCount(g) ? topicCount(g) + ' talks' : esc(g.description || '')) + '</span></div>').join('');
}

// A topic page, like a genre page: header, sub-topics, then the talks
// mainly about it, then talks that also discuss it.
async function openTopic(slug) {
  closeReader(); closeNowPlaying(); closeBrowseSheet();
  document.getElementById('filterRow').classList.remove('active');
  document.getElementById('rmeta').innerHTML =
    '<button class="chip back-link" onclick="goHome()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Home</button>';
  window.scrollTo(0, 0);
  showSkeletons();
  try {
    const j = await (await fetch('/api/search?topic=' + encodeURIComponent(slug))).json();
    if (j.error) throw new Error(j.error);
    const t = j.topic, parent = TOPIC_BY_SLUG[t.parent_slug];
    const total = j.main.length + j.related.length;
    document.getElementById('res').innerHTML =
      '<section class="topic-hero tg-' + groupIndex(t.slug) + '">'
        + '<div class="kicker">' + esc(parent ? parent.name_en : 'Topics') + '</div>'
        + '<h2>' + esc(t.name_en) + '</h2>'
        + (t.name_he ? '<div class="he" dir="rtl">' + esc(t.name_he) + '</div>' : '')
        + (t.description ? '<p>' + esc(t.description) + '</p>' : '')
        + '<div class="count">' + total + ' talk' + (total !== 1 ? 's' : '') + '</div>'
      + '</section>'
      + (j.subtopics.length ? '<div class="chip-scroll" style="margin:0 -16px 8px">' + j.subtopics.map(topicChipHtml).join('') + '</div>' : '')
      + (parent ? '<div class="chip-scroll" style="margin:0 -16px 8px">' + topicChipHtml(parent) + '</div>' : '')
      + (j.main.length ? '<h3 class="res-heading">' + (t.parent_slug ? 'Mainly about ' + esc(t.name_en) : 'Talks') + '</h3>' + j.main.map(r => trackRowHtml(r, true, true)).join('') : '')
      + (j.related.length ? '<h3 class="res-heading">Also discusses ' + esc(t.name_en) + '</h3>' + j.related.map(r => trackRowHtml(r, true, true)).join('') : '')
      + (!total ? '<div class="empty">No talks have been catalogued under this topic yet.</div>' : '');
    rebuildOrder();
  } catch (e) {
    document.getElementById('res').innerHTML = '<div class="empty">Could not load this topic: ' + esc(e.message) + '</div>';
  }
}

// The farbrengen a track belongs to, as a link to its full page.
function farbrengenLinkHtml(row, withArrow) {

async function openFarbrengen(fid) {

function showSkeletons() {
  let html = '';
