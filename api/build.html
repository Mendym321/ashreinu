<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Ashreinu Indexer</title>
<style>
body{font-family:-apple-system,sans-serif;background:#f5f3ee;padding:24px;max-width:640px;margin:0 auto;color:#12121f}
h2{font-size:18px}
.bar{height:6px;background:#e2dfd7;border-radius:3px;overflow:hidden;margin:14px 0}
.fill{height:100%;background:#c49a2a;width:0%;transition:width .3s}
#log{font-size:12px;color:#444;white-space:pre-wrap;background:#fff;border:1px solid #e2dfd7;border-radius:6px;padding:12px;max-height:340px;overflow:auto;line-height:1.6}
button{font-size:14px;font-weight:600;padding:10px 20px;background:#c49a2a;color:#fff;border:none;border-radius:6px;cursor:pointer}
button:disabled{background:#e2dfd7;color:#999}
.stat{font-size:13px;color:#666;margin-top:8px}
</style>
</head>
<body>
<h2>Ashreinu → Supabase indexer</h2>
<p style="font-size:14px;color:#555">Scans event IDs 1–14000 and writes each one into your Supabase table. Safe to run more than once — it overwrites existing rows rather than duplicating.</p>
<button id="go" onclick="run()">Start indexing</button>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="stat" id="stat"></div>
<div id="log"></div>
<script>
async function run(){
  document.getElementById('go').disabled = true;
  const TOTAL = 14000, STEP = 200;
  let totalUpserted = 0, totalFarb = 0;

  for (let start = 1; start <= TOTAL; start += STEP) {
    const end = Math.min(start + STEP - 1, TOTAL);
    log('Indexing ' + start + '–' + end + '...');
    let j = await tryFetch(start, end);
    if (!j) { log('  ! gave up on this range after retry'); continue; }
    totalUpserted += j.upserted || 0;
    totalFarb += j.farbrengens || 0;
    log('  -> ' + j.upserted + ' rows written (' + j.farbrengens + ' farbrengens, ' + j.notFound + ' gaps, ' + j.errors + ' errors)');
    document.getElementById('fill').style.width = (end/TOTAL*100) + '%';
    document.getElementById('stat').textContent = totalUpserted + ' total rows written so far, ' + totalFarb + ' farbrengens found';
  }
  log('DONE. Final total: ' + totalUpserted + ' rows.');
  document.getElementById('go').disabled = false;
  document.getElementById('go').textContent = 'Re-run';
}

async function tryFetch(start, end, attempt) {
  attempt = attempt || 1;
  try {
    const r = await fetch('/api/build-index?start=' + start + '&end=' + end);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } catch (e) {
    if (attempt < 2) {
      log('  ! error (' + e.message + '), retrying...');
      await new Promise(res => setTimeout(res, 1000));
      return tryFetch(start, end, attempt + 1);
    }
    return null;
  }
}

function log(msg){
  const el = document.getElementById('log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}
</script>
</body>
</html>
